<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MADB – Modelagem PostgreSQL com diagramas</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#d9dde3;--text:#1c2330;--muted:#667085;
  --accent:#2f5d9e;--accent-ink:#fff;--accent-soft:#e6eefb;--warn:#a15c00;--warn-bg:#fff4e0;--danger:#b42318;
  --pk:#b7791f;--fk:#2f7d5b;--code-bg:#0f1722;--code-ink:#d6e2f0;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151c;--panel:#18202b;--panel2:#1f2936;--line:#2c394a;--text:#e6ebf2;--muted:#93a1b5;
  --accent:#6ea0ec;--accent-ink:#0c1522;--accent-soft:#1d2d47;--warn:#f0b35a;--warn-bg:#33270f;--danger:#f97066;
  --pk:#e3b04b;--fk:#5fc79a;--code-bg:#0b1119;--code-ink:#d6e2f0}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header h1 span{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
.spacer{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button.sm{padding:2px 8px;font-size:12px}
input[type=text],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 7px;min-width:0}
input[type=text]:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
main{flex:1;min-height:0;display:grid;grid-template-columns:370px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px;min-height:0}
.right{display:flex;flex-direction:column;min-width:0;min-height:0}
.canvas-wrap{flex:1;min-height:200px;display:flex;flex-direction:column;min-height:0}
.toolbar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar .hint{color:var(--muted);font-size:12px}
.canvas{flex:1;overflow:auto;background:
  radial-gradient(var(--line) 1px,transparent 1px) 0 0/20px 20px,var(--bg)}
svg{display:block}
.out{height:300px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);align-items:flex-end}
.tab{padding:5px 12px;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;color:var(--muted);background:none}
.tab.on{background:var(--code-bg);color:var(--code-ink);border-color:var(--line)}
.tabs .spacer{flex:1}
.tabs .acts{display:flex;gap:6px;padding-bottom:5px;align-items:center}
.opt{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
textarea.code{flex:1;width:100%;border:none;border-radius:0;background:var(--code-bg);color:var(--code-ink);font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:10px 14px;resize:none;tab-size:2;white-space:pre}
.warns{background:var(--warn-bg);color:var(--warn);font-size:12px;padding:5px 12px;border-top:1px solid var(--line);max-height:70px;overflow:auto}
.warns:empty{display:none}
/* editor */
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:2px 0 6px;display:flex;align-items:center}
.sec .spacer{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.chip{padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.row label{font-size:12px;color:var(--muted);min-width:46px}
.row input[type=text]{flex:1}
.col{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--panel2)}
.col .l1{display:flex;gap:5px;margin-bottom:6px}
.col .l1 .nm{flex:1.2}
.col .l1 .ty{flex:1}
.col .l2{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.col .l2 label{display:flex;gap:3px;align-items:center;font-size:12px;cursor:pointer}
.col .l2 .df{flex:1;min-width:90px}
.col .l3{display:flex;gap:5px}
.col .l3 select{flex:1}
.empty{color:var(--muted);padding:20px 4px}
/* svg */
.tb{cursor:grab}
.tb:active{cursor:grabbing}
.tb .body{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.tb.sel .body{stroke:var(--accent);stroke-width:2}
.tb .hd{fill:var(--accent)}
.tb .ht{fill:var(--accent-ink);font:600 13px system-ui,sans-serif}
.tb .hs{fill:var(--accent-ink);opacity:.7;font:10px system-ui,sans-serif}
.tb .cn{fill:var(--text);font:12.5px system-ui,sans-serif}
.tb .ct{fill:var(--muted);font:11px ui-monospace,Menlo,Consolas,monospace}
.tb .tag-pk{fill:var(--pk);font:700 9.5px system-ui,sans-serif}
.tb .tag-fk{fill:var(--fk);font:700 9.5px system-ui,sans-serif}
.tb .rl{stroke:var(--line);stroke-width:.6}
.edge{fill:none;stroke:var(--fk);stroke-width:1.6;opacity:.85}
.card{fill:var(--fk);font:700 11px system-ui,sans-serif}
.ws{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:8px;padding-left:14px;border-left:1px solid var(--line)}
.ws label{font-size:12px;color:var(--muted)}
.ws select{max-width:240px;font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(420px,100%);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal h2{margin:0 0 10px;font-size:16px}
.modal input[type=text]{width:100%;margin-bottom:10px}
.modal .mmsg{margin:0 0 12px;color:var(--muted)}
.modal .mmsg:empty{display:none}
.modal .opt-r{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;cursor:pointer}
.modal .opt-r small{display:block;color:var(--muted)}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
@media (max-width:900px){
  .ws{border-left:none;padding-left:0;margin-left:0}
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  aside{border-right:none;border-bottom:1px solid var(--line);max-height:46vh}
  .out{height:260px}
}

.warns{max-height:110px}
.warns .er{color:var(--danger)}
.statusbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 16px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.statusbar b{color:var(--text);font-weight:600}
.statusbar .spacer{flex:1}
.statusbar label{display:flex;gap:4px;align-items:center}
.chip.mod{border-style:dashed}
.sub{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--panel2)}
.sub .r{display:flex;gap:5px;margin-bottom:5px;align-items:center;flex-wrap:wrap}
.sub .r>input[type=text],.sub .r>select{flex:1;min-width:80px}
.sub .r label{display:flex;gap:3px;align-items:center;font-size:12px;cursor:pointer}
.sub textarea{width:100%;min-height:60px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;margin-bottom:5px}
.bad{color:var(--danger);font-size:12px;display:block;margin:-2px 0 5px}
details.more{margin-top:6px}
details.more summary{cursor:pointer;font-size:12px;color:var(--muted)}
details.more .r{margin-top:6px}
.imp{border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;max-height:150px;overflow:auto;padding:6px 12px}
.imp[hidden]{display:none}
.imp .er{color:var(--danger)}.imp .wr{color:var(--warn)}.imp .ok{color:var(--fk)}
.imp code{font:11.5px ui-monospace,Menlo,Consolas,monospace;background:var(--panel2);padding:0 4px;border-radius:3px}
.imp .x{float:right}
.dropov{position:fixed;inset:0;z-index:60;background:rgba(47,93,158,.82);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;border:4px dashed #fff;margin:10px;border-radius:14px;pointer-events:none}
.dropov[hidden]{display:none}
.modal{width:min(480px,100%)}
</style>
</head>
<body>
<header>
  <h1>MADB<span>modelagem PostgreSQL · diagrama ER · DDL</span></h1>
  <div class="ws">
    <label for="wsSel">Arquitetura</label>
    <select id="wsSel" aria-label="Arquitetura ativa"></select>
    <button id="bWsNew" class="primary">+ Nova arquitetura</button>
    <button id="bWsRen">Renomear</button>
    <button id="bWsDup">Duplicar</button>
    <button id="bWsDel" class="ghost danger">Excluir</button>
  </div>
  <div class="spacer"></div>
  <button id="bClear" class="ghost danger">Limpar esta arquitetura</button>
</header>
<div class="modal-bg" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <p id="mMsg" class="mmsg"></p>
    <input type="text" id="mInput">
    <div id="mExtra"></div>
    <div class="mact"><button id="mCancel">Cancelar</button><button id="mOk" class="primary">OK</button></div>
  </div>
</div>
<div class="statusbar" id="status">
  <span id="origin">Origem: edição local</span>
  <span class="spacer"></span>
  <button class="sm" id="bOpen" title="Escolher um arquivo .json (ou arraste-o para a página)">Abrir arquivo…</button>
  <button class="sm" id="bLink" hidden>Vincular arquivo…</button>
  <button class="sm" id="bReload" hidden>Recarregar do arquivo</button>
  <button class="sm" id="bSave" hidden>Gravar no arquivo</button>
  <label id="autoW" hidden><input type="checkbox" id="optAuto"> sincronizar sozinho</label>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</div>
<div class="dropov" id="dropov" hidden>Solte o arquivo .json para importar</div>
<main>
  <aside>
    <div class="sec">Tabelas <span class="spacer"></span><button class="sm primary" id="bAddT">+ Nova tabela</button></div>
    <div class="chips" id="chips"></div>
    <div id="editor"></div>
  </aside>
  <div class="right">
    <div class="canvas-wrap">
      <div class="toolbar">
        <button class="sm" id="bLayout">Auto-organizar</button>
        <button class="sm" id="bZm">−</button>
        <span id="zl" style="min-width:42px;text-align:center;font-size:12px">100%</span>
        <button class="sm" id="bZp">+</button>
        <span class="hint">Arraste as tabelas · clique para editar</span>
      </div>
      <div class="canvas" id="canvas"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
    <div class="warns" id="warns"></div>
    <div class="out">
      <div class="tabs">
        <button class="tab on" data-t="sql">SQL (DDL)</button>
        <button class="tab" data-t="mmd">Mermaid</button>
        <button class="tab" data-t="json">JSON</button>
        <div class="spacer"></div>
        <div class="acts">
          <span id="optIdxW" style="display:flex;gap:8px;align-items:center">
            <label class="opt"><input type="checkbox" id="optIdx"> índices nas FKs</label>
            <label class="opt">nomes <select id="optNaming"><option value="idx">idx_tabela_col</option><option value="ix">ix_tabela__col</option></select></label>
          </span>
          <button class="sm" id="bDown" style="display:none">Baixar .json</button>
          <button class="sm" id="bApply" style="display:none">Aplicar JSON colado</button>
          <button class="sm primary" id="bCopy">Copiar</button>
        </div>
      </div>
      <div class="imp" id="imp" hidden></div>
      <textarea class="code" id="code" spellcheck="false" readonly></textarea>
    </div>
  </div>
</main>
<script src="madb-core.js"></script>
<datalist id="fns"></datalist>
<datalist id="types">
  <option>serial</option><option>bigserial</option><option>smallint</option><option>integer</option><option>bigint</option>
  <option>numeric(12,2)</option><option>real</option><option>double precision</option><option>boolean</option>
  <option>text</option><option>varchar(255)</option><option>char(1)</option><option>date</option><option>time</option>
  <option>timestamp</option><option>timestamptz</option><option>uuid</option><option>jsonb</option><option>json</option>
  <option>bytea</option><option>inet</option><option>integer[]</option><option>text[]</option>
</datalist>
<script>
'use strict';
const W=230,HH=34,RH=22;
const DEL=MADB.DEL_ACTIONS;
let S=MADB.emptyModel(),sel=null,zoom=1,tab='sql';
let idN=0;const nid=()=>'w'+Date.now().toString(36)+(++idN)+Math.random().toString(36).slice(2,5);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tOf=id=>MADB.tableById(S,id);
const cOf=(t,id)=>MADB.colById(t,id);
const baseType=MADB.baseType;
const MODEL='__model';
const drafts={};   // textos digitados que ainda não viraram dados válidos
const BASE_TYPES=$('#types').innerHTML;

/* ---------- criação ---------- */
function mkTable(name,x,y,schema){const t={id:MADB.newId(S,'table'),name,schema:schema||'public',x,y,cols:[]};S.tables.push(t);return t}
function mkCol(t,name,type,o){const c=Object.assign({id:MADB.newId(S,'col',t),name,type,pk:false,nn:false,uq:false,def:'',ref:null,del:'NO ACTION'},o||{});t.cols.push(c);return c}
function sample(){
  S=MADB.emptyModel();
  const cli=mkTable('clientes',40,40),prod=mkTable('produtos',40,260),ped=mkTable('pedidos',380,40),it=mkTable('itens_pedido',380,300);
  const cid=mkCol(cli,'id','bigint',{pk:true,nn:true,identity:'ALWAYS'});mkCol(cli,'nome','varchar(120)',{nn:true});
  mkCol(cli,'email','varchar(255)',{nn:true,uq:true});mkCol(cli,'criado_em','timestamptz',{nn:true,def:'now()'});
  const pid=mkCol(prod,'id','bigint',{pk:true,nn:true,identity:'ALWAYS'});mkCol(prod,'sku','varchar(40)',{nn:true,uq:true});
  mkCol(prod,'descricao','text');mkCol(prod,'preco','numeric(12,2)',{nn:true,def:'0'});mkCol(prod,'ativo','boolean',{nn:true,def:'true'});
  const oid=mkCol(ped,'id','bigint',{pk:true,nn:true,identity:'ALWAYS'});
  mkCol(ped,'cliente_id','bigint',{nn:true,ref:{t:cli.id,c:cid.id},del:'RESTRICT'});
  mkCol(ped,'status','varchar(20)',{nn:true,def:"'aberto'"});mkCol(ped,'total','numeric(12,2)',{nn:true,def:'0'});
  mkCol(ped,'criado_em','timestamptz',{nn:true,def:'now()'});
  mkCol(it,'pedido_id','bigint',{pk:true,nn:true,ref:{t:ped.id,c:oid.id},del:'CASCADE'});
  mkCol(it,'produto_id','bigint',{pk:true,nn:true,ref:{t:prod.id,c:pid.id},del:'RESTRICT'});
  mkCol(it,'quantidade','integer',{nn:true,def:'1'});mkCol(it,'preco_unit','numeric(12,2)',{nn:true});
  it.constraints=[{id:MADB.newId(S,'constraint',it),name:'ck_itens_pedido__quantidade',kind:'check',expr:'quantidade > 0'}];
  return S;
}

/* ---------- listas de colunas em texto ---------- */
const colNames=(t,ids)=>ids.map(i=>{const c=cOf(t,i);return c?c.name:'?'}).join(', ');
function parseColList(t,text){
  const names=String(text).split(',').map(x=>x.trim()).filter(Boolean),ids=[],bad=[];
  names.forEach(n=>{const c=t.cols.find(c=>c.name===n);if(c)ids.push(c.id);else bad.push(n)});
  if(!names.length)bad.push('(vazio)');
  return {ids,bad};
}
function splitTop(s){const out=[];let d=0,cur='';for(const ch of s){if(ch==='(')d++;if(ch===')')d--;if(ch===','&&d===0){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim()).filter(Boolean)}
function parseIdxCols(t,text){
  const cols=[],bad=[];
  splitTop(text).forEach(tok=>{
    if(tok.startsWith('(')&&tok.endsWith(')')){cols.push({expr:tok.slice(1,-1).trim()});return}
    const m=tok.match(/^(\S+?)(?:\s+(ASC|DESC))?(?:\s+NULLS\s+(FIRST|LAST))?$/i);
    const c=m&&t.cols.find(c=>c.name===m[1]);
    if(!c){bad.push(tok);return}
    const e={c:c.id};if(m[2])e.order=m[2].toUpperCase();if(m[3])e.nulls=m[3].toUpperCase();cols.push(e);
  });
  if(!cols.length&&!bad.length)bad.push('(vazio)');
  return {cols,bad};
}
const fmtIdxCols=(t,cols)=>cols.map(e=>e.expr?`(${e.expr})`:(cOf(t,e.c)?cOf(t,e.c).name:'?')+(e.order?' '+e.order:'')+(e.nulls?' NULLS '+e.nulls:'')).join(', ');
const dv=(key,fallback)=>key in drafts?drafts[key]:fallback;

/* ---------- editor ---------- */
function renderChips(){
  $('#chips').innerHTML=`<span class="chip mod ${sel===MODEL?'on':''}" data-id="${MODEL}" title="Schemas, enums, funções e opções do modelo">⚙ Modelo</span>`+
    S.tables.map(t=>`<span class="chip ${t.id===sel?'on':''}" data-id="${t.id}">${esc(t.name||'(sem nome)')}</span>`).join('');
}
function refOptions(t,c){
  let o=`<option value="">— sem chave estrangeira —</option>`;
  S.tables.forEach(x=>{ if(x.id===t.id&&false)return; x.cols.forEach(y=>{
    if(x.id===t.id&&y.id===c.id)return;
    const v=x.id+'|'+y.id, on=c.ref&&c.ref.t===x.id&&c.ref.c===y.id;
    o+=`<option value="${v}" ${on?'selected':''}>→ ${esc(x.name)}.${esc(y.name)}${y.pk?' (PK)':''}</option>`;});});
  return o;
}
const optList=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
function updateDatalists(){
  $('#types').innerHTML=BASE_TYPES+S.enums.map(e=>`<option>${esc(e.schema==='public'?e.name:e.schema+'.'+e.name)}</option>`).join('');
  $('#fns').innerHTML=S.functions.map(f=>`<option>${esc(f.schema+'.'+f.name)}</option>`).join('');
}
function conHTML(t,k){
  const d=(f,v)=>esc(dv(k.id+':'+f,v)), bad=drafts[k.id+':bad']?`<span class="bad">${esc(drafts[k.id+':bad'])}</span>`:'';
  let b='';
  if(k.kind==='check')b=`<div class="r"><input type="text" data-f="cexpr" value="${esc(k.expr||'')}" placeholder="expressão, ex.: quantidade > 0"></div>`;
  else if(k.kind==='unique')b=`<div class="r"><input type="text" data-f="ccols" value="${d('ccols',colNames(t,k.cols))}" placeholder="colunas, separadas por vírgula"><label><input type="checkbox" data-f="cnnd" ${k.nullsNotDistinct?'checked':''}>NULLS NOT DISTINCT</label></div>${bad}`;
  else{
    const rt=tOf(k.ref.t);
    b=`<div class="r"><input type="text" data-f="ccols" value="${d('ccols',colNames(t,k.cols))}" placeholder="colunas desta tabela"></div>
    <div class="r"><select data-f="creft">${S.tables.map(x=>`<option value="${x.id}" ${x.id===k.ref.t?'selected':''}>→ ${esc(x.name)}</option>`).join('')}</select>
      <input type="text" data-f="crefcols" value="${d('crefcols',rt?colNames(rt,k.ref.cols):'')}" placeholder="colunas referenciadas">
      <select data-f="cdel" title="ON DELETE">${optList(DEL,k.del)}</select></div>${bad}`;
  }
  return `<div class="sub" data-k="con" data-id="${k.id}"><div class="r"><select data-f="ckind">${['check','unique','fk'].map(x=>`<option value="${x}" ${x===k.kind?'selected':''}>${x==='fk'?'FK composta':x.toUpperCase()}</option>`).join('')}</select>
    <input type="text" data-f="cname" value="${esc(k.name||'')}" placeholder="nome da restrição"><button class="sm danger" data-a="delK" title="Remover">✕</button></div>${b}</div>`;
}
function idxHTML(t,x){
  const bad=drafts[x.id+':bad']?`<span class="bad">${esc(drafts[x.id+':bad'])}</span>`:'';
  return `<div class="sub" data-k="idx" data-id="${x.id}"><div class="r"><input type="text" data-f="iname" value="${esc(x.name)}" placeholder="nome do índice"><button class="sm danger" data-a="delI" title="Remover">✕</button></div>
  <div class="r"><input type="text" data-f="icols" value="${esc(dv(x.id+':icols',fmtIdxCols(t,x.cols)))}" placeholder="colunas: a, b DESC NULLS LAST, (lower(c))"></div>${bad}

const emptyDel=(o,k)=>{if(o[k]&&!o[k].length)delete o[k]};

/* edição por input (sem re-render, para não perder o foco) */
$('#editor').addEventListener('input',e=>{
  const el=e.target,f=el.dataset.f,g=el.dataset.g;
  if(g==='naming')return;
  if(!f)return;
  if(sel===MODEL)return modelInput(el,f);
  const t=tOf(sel);if(!t)return;
  const sub=el.closest('.sub'),col=el.closest('.col');
  if(f==='tname'){t.name=el.value;renderChips();renderOut();return}
  if(f==='tschema'){t.schema=el.value.trim()||'public';renderOut();return}
  if(f==='tcomment'){if(el.value)t.comment=el.value;else delete t.comment;renderOut(true);return}
  if(col){
    const c=cOf(t,col.dataset.cid);if(!c)return;
    if(['name','type','def'].includes(f)){c[f]=el.value;renderOut()}
    else if(f==='generated'){if(el.value)c.generated=el.value;else delete c.generated;renderOut(true)}
    else if(f==='comment'){if(el.value)c.comment=el.value;else delete c.comment;renderOut(true)}
    return;
  }
  if(!sub)return;
  const id=sub.dataset.id,k=sub.dataset.k;
  if(k==='con'){const o=(t.constraints||[]).find(x=>x.id===id);if(!o)return;
    if(f==='cname')o.name=el.value;else if(f==='cexpr')o.expr=el.value;
    else if(f==='ccols'||f==='crefcols'){drafts[id+':'+f]=el.value;return}
    renderOut(true)}
  else if(k==='idx'){const o=(t.indexes||[]).find(x=>x.id===id);if(!o)return;
    if(f==='iname')o.name=el.value;
    else if(f==='iwhere'){if(el.value)o.where=el.value;else delete o.where}
    else if(f==='imethod'){if(el.value)o.method=el.value;else delete o.method}
    else if(f==='icols'){drafts[id+':icols']=el.value;return}
    renderOut(true)}
  else if(k==='trg'){const o=(t.triggers||[]).find(x=>x.id===id);if(!o)return;
    if(f==='gname')o.name=el.value;else if(f==='gfn')o.function=el.value;
    else if(f==='gwhen'){if(el.value)o.when=el.value;else delete o.when}
    renderOut(true)}
  else if(k==='par'){const o=(t.partitions||[]).find(x=>x.id===id);if(!o)return;
    if(f==='xname')o.name=el.value;else if(f==='xbound')o.bound=el.value;
    renderOut(true)}
  if(f==='pcols'){drafts[t.id+':pcols']=el.value}
});
function modelInput(el,f){
  const sub=el.closest('.sub');if(!sub)return;
  const k=sub.dataset.k;
  if(k==='sch'){const s=S.schemas[+sub.dataset.i];if(!s)return;
    if(f==='sname')s.name=el.value;else if(f==='scomment'){if(el.value)s.comment=el.value;else delete s.comment}}
  else if(k==='enum'){const o=S.enums.find(x=>x.id===sub.dataset.id);if(!o)return;
    if(f==='schema')o.schema=el.value.trim()||'public';else if(f==='ename')o.name=el.value;
    else if(f==='evalues')o.values=el.value.split('\n').map(x=>x.trim()).filter(Boolean);
    else if(f==='ecomment'){if(el.value)o.comment=el.value;else delete o.comment}}
  else if(k==='fn'){const o=S.functions.find(x=>x.id===sub.dataset.id);if(!o)return;
    if(f==='schema')o.schema=el.value.trim()||'public';else if(f==='fname')o.name=el.value;
    else if(f==='fsql')o.sql=el.value;else if(f==='fcomment'){if(el.value)o.comment=el.value;else delete o.comment}}
  renderOut(true);
}
/* edição por change (pode re-renderizar) */
$('#editor').addEventListener('change',e=>{
  const el=e.target,f=el.dataset.f,g=el.dataset.g;
  if(g==='naming'){S.options=Object.assign({},S.options,{indexNaming:el.value});syncNaming();renderOut(true);return}
  if(!f)return;
  if(sel===MODEL){renderEditor();return}
  const t=tOf(sel);if(!t)return;
  const sub=el.closest('.sub'),col=el.closest('.col');
  if(['tname','tschema','name'].includes(f)){renderEditor();renderOut();return}
  if(col){
    const c=cOf(t,col.dataset.cid);if(!c)return;
    if(f==='pk'){c.pk=el.checked;if(c.pk)c.nn=true}
    else if(f==='nn'||f==='uq')c[f]=el.checked;
    else if(f==='ref'){const v=el.value;if(!v)c.ref=null;else{const [a,b]=v.split('|');c.ref={t:a,c:b};
        const rc=cOf(tOf(a),b);if(rc&&(!c.type||c.type==='text'))c.type=baseType(rc.type)}}
    else if(f==='del')c.del=el.value;
    else if(f==='identity'){if(el.value)c.identity=el.value;else delete c.identity}
    renderAll();return;
  }
  if(f==='pby'){
    if(!el.value){delete t.partition;delete t.partitions}
    else if(!t.partition){const pk=t.cols.filter(c=>c.pk);t.partition={by:el.value,cols:(pk[pk.length-1]||t.cols[0]||{}).id?[(pk[pk.length-1]||t.cols[0]).id]:[]}}
    else t.partition.by=el.value;
    renderAll();return;
  }
  if(f==='pcols'){const r=parseColList(t,el.value);
    if(r.bad.length)drafts[t.id+':bad']='Coluna(s) que não existem em "'+t.name+'": '+r.bad.join(', ');
    else{t.partition.cols=r.ids;delete drafts[t.id+':bad'];delete drafts[t.id+':pcols']}
    renderAll();return;}
  if(!sub)return;
  const id=sub.dataset.id,k=sub.dataset.k;
  if(k==='con'){const o=(t.constraints||[]).find(x=>x.id===id);if(!o)return;
    if(f==='ckind'){
      delete o.expr;delete o.cols;delete o.ref;delete o.del;delete o.nullsNotDistinct;o.kind=el.value;
      Object.keys(drafts).filter(x=>x.startsWith(id+':')).forEach(x=>delete drafts[x]);
      if(o.kind==='check')o.expr='';
      else{o.cols=[];if(o.kind==='fk'){const rt=S.tables.find(x=>x.id!==t.id)||t;o.ref={t:rt.id,cols:[]};o.del='NO ACTION'}}
    }
    else if(f==='cnnd'){if(el.checked)o.nullsNotDistinct=true;else delete o.nullsNotDistinct}
    else if(f==='cdel')o.del=el.value;
    else if(f==='creft'){o.ref={t:el.value,cols:[]};delete drafts[id+':crefcols'];delete drafts[id+':bad']}
    else if(f==='ccols'||f==='crefcols'){
      const target=f==='ccols'?t:tOf(o.ref.t),r=parseColList(target,el.value);
      if(r.bad.length)drafts[id+':bad']='Coluna(s) que não existem em "'+target.name+'": '+r.bad.join(', ');
      else{if(f==='ccols')o.cols=r.ids;else o.ref.cols=r.ids;delete drafts[id+':bad'];delete drafts[id+':'+f]}
    }
    renderAll();return}
  if(k==='idx'){const o=(t.indexes||[]).find(x=>x.id===id);if(!o)return;
    if(f==='iuq'){if(el.checked)o.unique=true;else delete o.unique}
    else if(f==='innd'){if(el.checked)o.nullsNotDistinct=true;else delete o.nullsNotDistinct}
    else if(f==='icols'){const r=parseIdxCols(t,el.value);
      if(r.bad.length)drafts[id+':bad']='Não entendi: '+r.bad.join(' | ')+' (use nomes de colunas desta tabela ou (expressão))';
      else{o.cols=r.cols;delete drafts[id+':bad'];delete drafts[id+':icols']}}
    renderAll();return}
  if(k==='trg'){const o=(t.triggers||[]).find(x=>x.id===id);if(!o)return;
    if(f==='gtiming')o.timing=el.value;else if(f==='glevel')o.level=el.value;
    else if(f==='gev'){o.events=MADB.TRIGGER_EVENTS.filter(ev=>sub.querySelector(`[data-f=gev][value="${ev}"]`).checked)}
    renderAll();return}
  renderAll();
});

  else if(a==='delG'){t.triggers=t.triggers.filter(x=>x.id!==sub.dataset.id);emptyDel(t,'triggers')}
  else if(a==='addP'){(t.partitions=t.partitions||[]).push({id:MADB.newId(S,'partition',t),name:`${t.name}_p${t.partitions.length+1}`,bound:t.partition&&t.partition.by==='HASH'?'WITH (MODULUS 4, REMAINDER 0)':t.partition&&t.partition.by==='LIST'?"IN ('A')":"FROM ('2026-01-01') TO ('2026-02-01')"})}
  else if(a==='delP'){t.partitions=t.partitions.filter(x=>x.id!==sub.dataset.id);emptyDel(t,'partitions')}
  renderAll();

/* ---------- diagrama ---------- */
const tH=MADB.tableHeight;
function rowY(t,c){return t.y+HH+t.cols.indexOf(c)*RH+RH/2}
function edge(s,c,t,rc,many){
  const y1=rowY(s,c),y2=rowY(t,rc);
  const right=(s.x+W/2)<=(t.x+W/2);
  let x1,x2,d1,d2;
  if(s===t){x1=s.x+W;x2=s.x+W;d1=1;d2=1}
  else if(right){x1=s.x+W;x2=t.x;d1=1;d2=-1}
  else{x1=s.x;x2=t.x+W;d1=-1;d2=1}
  const k=s===t?60:Math.max(40,Math.abs(x2-x1)/2);
  return `<path class="edge" d="M${x1},${y1} C${x1+d1*k},${y1} ${x2+d2*k},${y2} ${x2},${y2}"/>
  <text class="card" x="${x1+d1*12-(d1<0?4:0)}" y="${y1-5}" text-anchor="${d1>0?'start':'end'}">${many?'N':'1'}</text>
  <text class="card" x="${x2+d2*12-(d2<0?4:0)}" y="${y2-5}" text-anchor="${d2>0?'start':'end'}">1</text>`;
}
function renderDiagram(){
  MADB.autoLayout(S,false);
  let mx=0,my=0;
  S.tables.forEach(t=>{mx=Math.max(mx,t.x+W);my=Math.max(my,t.y+tH(t))});
  const w=Math.max(mx+80,600),h=Math.max(my+80,360);
  const svg=$('#svg');
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('width',w*zoom);svg.setAttribute('height',h*zoom);
  let o='';
  S.tables.forEach(s=>{
    s.cols.forEach(c=>{
      if(!c.ref)return;
      const t=tOf(c.ref.t),rc=cOf(t,c.ref.c);if(!t||!rc)return;
      o+=edge(s,c,t,rc,!(c.uq||c.pk&&s.cols.filter(z=>z.pk).length===1));
    });
    (s.constraints||[]).forEach(k=>{
      if(k.kind!=='fk')return;
      const t=tOf(k.ref.t),c=cOf(s,k.cols[0]),rc=cOf(t,k.ref.cols[0]);if(!t||!c||!rc)return;
      o+=edge(s,c,t,rc,true);
    });
  });
  S.tables.forEach(t=>{
    const h=tH(t),sub=[t.schema&&t.schema!=='public'?t.schema:'',t.partition?'particionada':''].filter(Boolean).join(' · ');
    const compFk=new Set();(t.constraints||[]).forEach(k=>{if(k.kind==='fk')k.cols.forEach(i=>compFk.add(i))});
    o+=`<g class="tb ${t.id===sel?'sel':''}" data-id="${t.id}" transform="translate(${t.x},${t.y})">
      <rect class="body" width="${W}" height="${h}" rx="7"/>
      <path class="hd" d="M0,7 a7,7 0 0 1 7,-7 h${W-14} a7,7 0 0 1 7,7 v${HH-7} h-${W} z"/>
      <text class="ht" x="12" y="${sub?15:21}">${esc(t.name)}</text>
      ${sub?`<text class="hs" x="12" y="28">${esc(sub)}</text>`:''}`;
    t.cols.forEach((c,i)=>{
      const y=HH+i*RH;
      if(i)o+=`<line class="rl" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`;
      const fk=c.ref||compFk.has(c.id);
      const tag=c.pk&&fk?'PK·FK':c.pk?'PK':fk?'FK':'';
      o+=`<text class="${c.pk?'tag-pk':'tag-fk'}" x="10" y="${y+15}">${tag}</text>
      <text class="cn" x="${tag?(tag.length>2?44:28):12}" y="${y+15}" ${c.pk?'font-weight="600"':''}>${esc(c.name)}${(c.nn||c.pk)?'':'?'}</text>
      <text class="ct" x="${W-10}" y="${y+15}" text-anchor="end">${esc(c.type.length>16?c.type.slice(0,15)+'…':c.type)}</text>`;
    });
    o+='</g>';
  });
  if(!S.tables.length)o='<text x="30" y="50" fill="currentColor" opacity=".5" font-size="14">Adicione uma tabela ou importe um JSON para começar o diagrama.</text>';
  svg.innerHTML=o;
  $('#zl').textContent=Math.round(zoom*100)+'%';
}
let drag=null;
$('#svg').addEventListener('pointerdown',e=>{
  const g=e.target.closest('.tb');if(!g)return;
  const t=tOf(g.dataset.id);if(!t)return;
  drag={id:t.id,sx:e.clientX,sy:e.clientY,ox:t.x,oy:t.y,moved:false};
  e.preventDefault();
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  const t=tOf(drag.id);const dx=(e.clientX-drag.sx)/zoom,dy=(e.clientY-drag.sy)/zoom;
  if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
  if(!drag.moved)return;
  t.x=Math.max(0,Math.round(drag.ox+dx));t.y=Math.max(0,Math.round(drag.oy+dy));
  renderDiagram();
});
window.addEventListener('pointerup',()=>{
  if(!drag)return;
  const id=drag.id,moved=drag.moved;drag=null;
  if(sel!==id){sel=id;renderEditor()}
  renderDiagram();if(moved)renderOut(true);
});

/* ---------- importação de JSON (colar, arquivo, arrastar) ---------- */
function showImport(r,origem){
  const box=$('#imp');
  const li=(cls,i)=>`<div class="${cls}">${cls==='er'?'✖':cls==='wr'?'⚠':'ℹ'} ${i.path&&i.path!=='(JSON)'?`<code>${esc(i.path)}</code> `:''}${esc(i.message)}</div>`;
  let h=`<button class="sm ghost x" id="impX">fechar</button>`;
  if(r.errors.length)h+=`<div class="er"><b>Não importei ${esc(origem)} — nada foi alterado.</b> ${r.errors.length} problema(s):</div>`+r.errors.slice(0,40).map(i=>li('er',i)).join('')+(r.errors.length>40?`<div class="er">… e mais ${r.errors.length-40}</div>`:'');
  else h+=`<div class="ok"><b>Importado: ${esc(origem)}.</b> ${esc(JSON.stringify(MADB.summary(r.model)))}</div>`;
  h+=(r.warnings||[]).slice(0,15).map(i=>li('wr',i)).join('')+(r.notes||[]).slice(0,10).map(i=>li('nt',i)).join('');
  box.innerHTML=h;box.hidden=false;
  $('#impX').onclick=()=>box.hidden=true;
}
function importText(text,origem,after){
  const r=MADB.load(text);
  showImport(r,origem);
  if(r.errors.length||!r.model)return false;
  const go=mode=>{ // 'novo' | 'substituir'
    if(mode==='novo'){saveDB();const w=newWs(origem.replace(/\.json$/i,''),r.model);DB.active=w.id;S=w.model;loadLink();}
    else{S=r.model;cur().model=S}
    sel=S.tables[0]?S.tables[0].id:null;zoom=1;
    markSynced(null,'importado de '+origem);
    renderWs();renderAll();if(after)after(r);
  };
  if(!S.tables.length&&!S.enums.length&&!S.functions.length)go('substituir');
  else openModal({title:'Importar na arquitetura atual?',input:false,ok:'Importar',
    msg:`A arquitetura "${cur().name}" já tem ${S.tables.length} tabela(s). O que fazer com o conteúdo de ${origem}?`,
    extra:`<label class="opt-r"><input type="radio" name="ini" value="novo" checked><span>Criar uma nova arquitetura<small>Mantém a atual como está (recomendado)</small></span></label>
           <label class="opt-r"><input type="radio" name="ini" value="substituir"><span>Substituir a atual<small>As alterações feitas aqui serão perdidas</small></span></label>`,
    onOk:(_,v)=>go(v||'novo')});
  return true;
}
async function importFile(file){
  if(!file)return;
  if(file.size>8*1024*1024){showImport({errors:[{path:'(arquivo)',message:`Arquivo grande demais (${Math.round(file.size/1048576)} MB; máximo 8 MB).`}],warnings:[],notes:[]},file.name);return}
  let text;try{text=await file.text()}catch(e){showImport({errors:[{path:'(arquivo)',message:'Não consegui ler o arquivo: '+e.message}],warnings:[],notes:[]},file.name);return}
  setTab('json');importText(text,file.name);
}
function setTab(t){document.querySelector(`.tab[data-t="${t}"]`).click()}
$('#bApply').onclick=()=>importText($('#code').value,'o JSON colado');
$('#bDown').onclick=()=>{

};

/* ---------- áreas de trabalho (arquiteturas) ---------- */
const KEY='madb_ws_v1';
let DB={ws:[],active:null};
function cur(){return DB.ws.find(w=>w.id===DB.active)}
function saveDB(){
  const w=cur();if(!w)return;

function renderWs(){

function newWs(name,model){

/* modal simples (alert/prompt são bloqueados em páginas embutidas) */
function openModal(o){
  const m=$('#modal'),inp=$('#mInput'),ok=$('#mOk');
  $('#mTitle').textContent=o.title;$('#mMsg').textContent=o.msg||'';
  inp.style.display=o.input===false?'none':'';inp.value=o.value||'';
  $('#mExtra').innerHTML=o.extra||'';
  ok.textContent=o.ok||'OK';ok.className=o.danger?'danger':'primary';
  m.hidden=false;
  (o.input===false?ok:inp).focus();if(o.input!==false)inp.select();
  const close=()=>{m.hidden=true;document.removeEventListener('keydown',key);if(o.onCancel)o.onCancel()};
  const done=()=>{const v=inp.value;const ex=document.querySelector('#mExtra input:checked');m.hidden=true;document.removeEventListener('keydown',key);o.onOk(v,ex?ex.value:null)};
  const key=e=>{if(e.key==='Escape')close();else if(e.key==='Enter'&&document.activeElement.tagName!=='BUTTON'&&document.activeElement.tagName!=='INPUT')done();else if(e.key==='Enter'&&document.activeElement===inp&&o.input!==false)done()};
  document.addEventListener('keydown',key);
  ok.onclick=done;$('#mCancel').onclick=close;
  m.onclick=e=>{if(e.target===m)close()};
}
$('#wsSel').onchange=e=>switchTo(e.target.value);
$('#bWsNew').onclick=()=>openModal({

         <label class="opt-r"><input type="radio" name="ini" value="exemplo"><span>Começar com o exemplo<small>Modelo de e-commerce para editar</small></span></label>`,
  onOk:(name,ini)=>{saveDB();const w=newWs(name,ini==='exemplo'?sample():MADB.emptyModel());switchTo(w.id)}

$('#bWsRen').onclick=()=>openModal({title:'Renomear arquitetura',value:cur().name,ok:'Salvar',

$('#bWsDup').onclick=()=>{

$('#bWsDel').onclick=()=>openModal({

/* ---------- origem, arquivo vinculado e sincronização ---------- */
const FSA=typeof window.showOpenFilePicker==='function';
const hhmm=ts=>new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function modelHash(){
  const o=MADB.serialize(S);o.tables.forEach(t=>{delete t.x;delete t.y});
  return MADB.stableStringify(o);
}
const isDirty=()=>{const w=cur();return !!w&&w.syncHash!=null&&w.syncHash!==modelHash()};
function setOrigin(text){const w=cur();if(w){w.origin={text,at:Date.now()}}}
function markSynced(stamp,text){const w=cur();if(!w)return;w.syncHash=modelHash();if(stamp!=null)w.fileStamp=stamp;if(text)setOrigin(text)}
let link=null; // {handle,perm}
function renderStatus(){
  const w=cur();if(!w)return;
  const o=w.origin||{text:'edição local',at:Date.now()};
  const dirty=isDirty();
  $('#origin').innerHTML=`Origem: <b>${esc(o.text)}</b> · ${hhmm(o.at)}`+(w.link?` · arquivo vinculado: <b>${esc(w.link.name)}</b>`:'')+(dirty?' · <span style="color:var(--warn)">alterações locais ainda não gravadas no arquivo</span>':'');
  $('#bLink').hidden=!FSA||!!link;
  $('#bReload').hidden=!link;
  $('#bSave').hidden=!link;
  $('#autoW').hidden=!link;
  $('#optAuto').checked=!!w.auto;
}
/* IndexedDB guarda o "handle" do arquivo (localStorage não consegue) */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('madb',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const handles={};
async function idbSet(k,v){handles[k]=v;try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
async function idbGet(k){try{const d=await idb();return await new Promise((res,rej)=>{const r=d.transaction('h').objectStore('h').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}}
async function idbDel(k){delete handles[k];try{const d=await idb();d.transaction('h','readwrite').objectStore('h').delete(k)}catch(e){}}
async function loadLink(){
  link=null;const w=cur();
  if(w&&w.link){const h=handles[w.id]||await idbGet(w.id);if(h&&cur()===w){handles[w.id]=h;link={handle:h}}}
  renderStatus();
}
async function ensurePerm(mode){
  if(!link)return false;
  try{
    const o={mode:mode||'read'};
    if(await link.handle.queryPermission(o)==='granted')return true;
    return (await link.handle.requestPermission(o))==='granted';
  }catch(e){return false}
}
$('#bLink').onclick=async()=>{
  try{
    const [h]=await window.showOpenFilePicker({types:[{description:'Modelo MADB (JSON)',accept:{'application/json':['.json']}}]});
    const w=cur();w.link={name:h.name};await idbSet(w.id,h);link={handle:h};
    await pullFromFile(true);
  }catch(e){if(e&&e.name!=='AbortError')showImport({errors:[{path:'(arquivo)',message:'Não consegui vincular o arquivo: '+e.message}],warnings:[],notes:[]},'arquivo')}
};
$('#bReload').onclick=()=>pullFromFile(true);
$('#optAuto').onchange=e=>{cur().auto=e.target.checked;if(e.target.checked)pullFromFile(false)};
function keepPositions(m){ // mantém onde o usuário colocou as tabelas
  m.tables.forEach(t=>{const old=tOf(t.id);if(old&&old.x!=null){t.x=old.x;t.y=old.y}});return m;
}
async function pullFromFile(manual){
  if(!link||pulling)return;pulling=true;
  try{
    if(!await ensurePerm('read')){if(manual)showImport({errors:[{path:'(arquivo)',message:'Sem permissão para ler o arquivo vinculado.'}],warnings:[],notes:[]},cur().link.name);return}
    const file=await link.handle.getFile(),w=cur();
    if(!manual&&file.lastModified===w.fileStamp)return;
    const text=await file.text(),r=MADB.load(text);
    if(r.errors.length||!r.model){showImport(r,file.name);w.fileStamp=file.lastModified;return}
    const incoming=r.model,same=MADB.stableStringify(stripXY(MADB.serialize(incoming)))===modelHash();
    if(same){markSynced(file.lastModified);renderStatus();if(manual)showImport(r,file.name+' (já estava igual)');return}
    const apply=()=>{S=keepPositions(incoming);w.model=S;if(!S.tables.find(t=>t.id===sel)&&sel!==MODEL)sel=S.tables[0]?S.tables[0].id:null;
      markSynced(file.lastModified,'recebido do arquivo '+file.name);showImport(r,file.name);renderAll()};
    if(!isDirty()&&w.syncHash!=null||!S.tables.length&&!S.enums.length&&!S.functions.length)apply();
    else openModal({title:'O arquivo mudou e você também alterou aqui',input:false,ok:'Continuar',
      msg:`"${file.name}" tem uma versão diferente da que está nesta arquitetura. Nada será sobrescrito sem a sua escolha:`,
      extra:`<label class="opt-r"><input type="radio" name="ini" value="novo" checked><span>Abrir a do arquivo como nova arquitetura<small>Guarda as duas versões para você comparar (recomendado)</small></span></label>
             <label class="opt-r"><input type="radio" name="ini" value="arquivo"><span>Usar a do arquivo nesta arquitetura<small>As alterações feitas aqui serão perdidas</small></span></label>
             <label class="opt-r"><input type="radio" name="ini" value="minha"><span>Manter a minha<small>Ignora esta versão do arquivo (não pergunto de novo até ele mudar outra vez)</small></span></label>`,
      onOk:(_,v)=>{
        if(v==='arquivo')apply();
        else if(v==='minha'){w.fileStamp=file.lastModified;renderStatus()}
        else{saveDB();const nw=newWs(w.name+' (do arquivo)',incoming);nw.link=w.link;idbSet(nw.id,link.handle);nw.fileStamp=file.lastModified;
          DB.active=nw.id;S=nw.model;sel=S.tables[0]?S.tables[0].id:null;markSynced(file.lastModified,'recebido do arquivo '+file.name);loadLink();renderWs();renderAll();showImport(r,file.name)}
      },
      onCancel:()=>{}});
  }catch(e){if(manual)showImport({errors:[{path:'(arquivo)',message:'Falha ao ler o arquivo vinculado: '+e.message}],warnings:[],notes:[]},'arquivo')}
  finally{pulling=false}
}
let pulling=false;
function stripXY(o){o.tables.forEach(t=>{delete t.x;delete t.y});return o}
$('#bSave').onclick=async()=>{
  if(!link)return;
  try{
    if(!await ensurePerm('readwrite'))return;
    const w=cur(),file=await link.handle.getFile();
    const write=async()=>{
      const ws=await link.handle.createWritable();await ws.write(genJSON());await ws.close();
      const f2=await link.handle.getFile();markSynced(f2.lastModified,'gravado em '+f2.name);renderStatus();
    };
    if(w.fileStamp!=null&&file.lastModified!==w.fileStamp)
      openModal({title:'Sobrescrever o arquivo?',input:false,ok:'Sobrescrever',danger:true,
        msg:`"${file.name}" foi alterado por outro programa (talvez o agente) depois da última sincronização. Gravar agora substitui essa versão pela desta tela. Use "Recarregar do arquivo" se quiser ver a dele primeiro.`,onOk:write});
    else await write();
  }catch(e){showImport({errors:[{path:'(arquivo)',message:'Falha ao gravar: '+e.message}],warnings:[],notes:[]},'arquivo')}
};
setInterval(()=>{const w=cur();if(w&&w.auto&&link&&!document.hidden&&$('#modal').hidden)pullFromFile(false)},2000);

/* ---------- inicialização ---------- */
(function(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const p=JSON.parse(raw);
      DB.ws=(p.ws||[]).map(w=>{
        const n=MADB.normalize(w.model||{tables:[]});
        if(!n.model){try{localStorage.setItem('madb_backup_'+(w.id||nid()),JSON.stringify(w.model))}catch(e){}}
        return {id:w.id||nid(),name:String(w.name||'Arquitetura'),model:n.model||MADB.emptyModel(),origin:w.origin,link:w.link,auto:!!w.auto,syncHash:w.syncHash,fileStamp:w.fileStamp};
      });
      DB.active=p.active;
    }else{
      const old=localStorage.getItem('pgarch'); // versão anterior (uma única arquitetura)
      if(old){const n=MADB.normalize(JSON.parse(old));if(n.model&&n.model.tables.length)DB.ws=[{id:nid(),name:'Minha arquitetura',model:n.model}]}
    }
  }catch(e){}
