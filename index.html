<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MADB – Modelagem PostgreSQL com diagramas</title>
<style>
:root{
  --bg:#0a0a0a;--panel:#141414;--panel2:#1c1c1c;--line:#2e2e2e;--text:#f2f2f2;--muted:#9a9a9a;
  --accent:#facc15;--accent-ink:#0a0a0a;--accent-soft:#2a2505;--warn:#facc15;--warn-bg:#2a2505;--danger:#ff6b6b;
  --pk:#facc15;--fk:#a3a3a3;--code-bg:#050505;--code-ink:#e5e5e5;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header h1 span{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
.spacer{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button.sm{padding:2px 8px;font-size:12px}
input[type=text],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 7px;min-width:0}
input[type=text]:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr;position:relative;overflow:hidden}
/* o editor desliza por cima do canvas: o tamanho do diagrama não muda e o mouse não sai do lugar */
aside{position:absolute;top:44px;left:0;bottom:0;width:370px;max-width:92%;z-index:30;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px;min-height:0;box-shadow:10px 0 28px rgba(0,0,0,.35);transform:translateX(-104%);visibility:hidden;pointer-events:none;transition:transform .16s ease-out,visibility 0s linear .16s}
main.open aside{transform:none;visibility:visible;pointer-events:auto;transition:transform .16s ease-out,visibility 0s}
.right{display:flex;flex-direction:column;min-width:0;min-height:0}
.canvas-wrap{flex:1;min-height:200px;display:flex;flex-direction:column;min-height:0}
.toolbar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar .hint{color:var(--muted);font-size:12px}
.canvas{flex:1;overflow:hidden;position:relative;touch-action:none;background:
  radial-gradient(var(--line) 1px,transparent 1px) 0 0/20px 20px,var(--bg)}
svg{display:block;width:100%;height:100%;user-select:none}
.out{height:300px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.right.nocode .out{display:none}
button:disabled{opacity:.4;cursor:default}
button:disabled:hover{border-color:var(--line)}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);align-items:flex-end}
.tab{padding:5px 12px;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;color:var(--muted);background:none}
.tab.on{background:var(--code-bg);color:var(--code-ink);border-color:var(--line)}
.tabs .spacer{flex:1}
.tabs .acts{display:flex;gap:6px;padding-bottom:5px;align-items:center}
.opt{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
textarea.code{flex:1;width:100%;border:none;border-radius:0;background:var(--code-bg);color:var(--code-ink);font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:10px 14px;resize:none;tab-size:2;white-space:pre}
.warns{background:var(--warn-bg);color:var(--warn);font-size:12px;padding:5px 12px;border-top:1px solid var(--line);max-height:70px;overflow:auto}
.warns:empty{display:none}
.warns.closed{display:none}
.warns .wbar{position:sticky;top:-5px;display:flex;align-items:center;gap:6px;background:var(--warn-bg);padding:2px 0 4px;margin-bottom:2px}
.warns .wt{font-weight:600}
/* editor */
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:2px 0 6px;display:flex;align-items:center}
.sec .spacer{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.chip{padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.row label{font-size:12px;color:var(--muted);min-width:46px}
.row input[type=text]{flex:1}
.col{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--panel2)}
.col .l1{display:flex;gap:5px;margin-bottom:6px}
.col .l1 .nm{flex:1.2}
.col .l1 .ty{flex:1}
.col .l2{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.col .l2 label{display:flex;gap:3px;align-items:center;font-size:12px;cursor:pointer}
.col .l2 .df{flex:1;min-width:90px}
.col .l3{display:flex;gap:5px}
.col .l3 select{flex:1}
.empty{color:var(--muted);padding:20px 4px}
/* svg */
.tb{cursor:grab}
.tb:active{cursor:grabbing}
.tb .body{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.tb.sel .body{stroke:var(--accent);stroke-width:2}
.tb .hd{fill:var(--accent)}
.tb .ht{fill:var(--accent-ink);font:600 13px system-ui,sans-serif}
.tb .hs{fill:var(--accent-ink);opacity:.7;font:10px system-ui,sans-serif}
.tb .cn{fill:var(--text);font:12.5px system-ui,sans-serif}
.tb .ct{fill:var(--muted);font:11px ui-monospace,Menlo,Consolas,monospace}
.tb .tag-pk{fill:var(--pk);font:700 9.5px system-ui,sans-serif}
.tb .tag-fk{fill:var(--fk);font:700 9.5px system-ui,sans-serif}
.tb .rl{stroke:var(--line);stroke-width:.6}
.edge{fill:none;stroke:var(--fk);stroke-width:1.6;opacity:.85}
.card{fill:var(--fk);font:700 11px system-ui,sans-serif}
.ws{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:8px;padding-left:14px;border-left:1px solid var(--line)}
.ws label{font-size:12px;color:var(--muted)}
.ws select{max-width:240px;font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(420px,100%);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal h2{margin:0 0 10px;font-size:16px}
.modal input[type=text]{width:100%;margin-bottom:10px}
.modal .mmsg{margin:0 0 12px;color:var(--muted)}
.modal .mmsg:empty{display:none}
.modal .opt-r{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;cursor:pointer}
.modal .opt-r small{display:block;color:var(--muted)}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
@media (max-width:900px){
  .ws{border-left:none;padding-left:0;margin-left:0}
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  aside{top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;max-height:46vh;border-left:none;border-top:1px solid var(--line);transform:translateY(104%);box-shadow:0 -10px 28px rgba(0,0,0,.35)}
  main.open aside{transform:none}
  .out{height:260px}
}

.warns{max-height:110px}
.warns .er{color:var(--danger)}
.statusbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 16px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.statusbar b{color:var(--text);font-weight:600}
.statusbar .spacer{flex:1}
.statusbar label{display:flex;gap:4px;align-items:center}
.chip.mod{border-style:dashed}
.sub{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--panel2)}
.sub .r{display:flex;gap:5px;margin-bottom:5px;align-items:center;flex-wrap:wrap}
.sub .r>input[type=text],.sub .r>select{flex:1;min-width:80px}
.sub .r label{display:flex;gap:3px;align-items:center;font-size:12px;cursor:pointer}
.sub textarea{width:100%;min-height:60px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;margin-bottom:5px}
.bad{color:var(--danger);font-size:12px;display:block;margin:-2px 0 5px}
details.more{margin-top:6px}
details.more summary{cursor:pointer;font-size:12px;color:var(--muted)}
details.more .r{margin-top:6px}
.imp{border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;max-height:150px;overflow:auto;padding:6px 12px}
.imp[hidden]{display:none}
.imp .er{color:var(--danger)}.imp .wr{color:var(--warn)}.imp .ok{color:var(--fk)}
.imp code{font:11.5px ui-monospace,Menlo,Consolas,monospace;background:var(--panel2);padding:0 4px;border-radius:3px}
.imp .x{float:right}
.dropov{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--accent) 85%,transparent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;border:4px dashed #fff;margin:10px;border-radius:14px;pointer-events:none}
.dropov[hidden]{display:none}
.modal{width:min(480px,100%)}
.schl{fill:var(--muted);font:700 11px system-ui,sans-serif;letter-spacing:.6px;text-transform:uppercase}
.fab{cursor:pointer}
.fab circle{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.fab text{fill:var(--accent-ink);font:700 11px system-ui,sans-serif;pointer-events:none}
.fab.pill rect{fill:var(--panel);stroke:var(--accent);stroke-width:1.2}
.fab.pill text{fill:var(--accent);font:600 11px system-ui,sans-serif}
.fab:hover circle,.fab:hover rect{filter:brightness(1.2)}
.pop{position:fixed;z-index:70;width:300px;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.pop[hidden]{display:none}
.pop .pr1{display:flex;gap:6px;margin-bottom:6px}
.pop .pr1 input{flex:1;min-width:0}
.pop .pr2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:12px}
.pop .pr2 label{display:flex;gap:3px;align-items:center;cursor:pointer}
.pop .pr2 .spacer{flex:1}
.pop .muted{color:var(--muted);font:11px ui-monospace,Menlo,Consolas,monospace}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--code-bg);color:var(--code-ink);padding:5px 9px;border-radius:6px;font:12px/1.35 system-ui,sans-serif;width:max-content;max-width:300px;z-index:120;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}
header{padding:8px 14px;gap:14px}
.brand{font-weight:800;letter-spacing:.6px;font-size:15px;color:var(--accent)}
.ws{margin-left:0;padding-left:0;border-left:none}
.ws select{max-width:220px}
.avatar{width:30px;height:30px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.statusbar{font-size:12px;padding:4px 14px}
.toolbar{padding:6px 10px;gap:4px}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.zl{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
.sm.on{border-color:var(--accent);color:var(--accent)}
.warnt{color:var(--warn)}.okt{color:var(--fk)}
.userp{left:auto!important;right:12px;top:52px;width:280px}
.userp .uh{font-weight:650;margin-bottom:10px}
.userp .ul{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin-bottom:10px}
.userp .ul input,.userp .ul select{font-size:14px;color:var(--text);padding:6px 8px}
.userp .un{font-size:11.5px;color:var(--muted);margin:0}
.hint{display:none}
#salap{width:320px;left:auto!important;right:12px;top:52px}
#salap .uh{font-weight:650;margin-bottom:10px}
#salap .ul{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin-bottom:10px}
#salap .ul input{font-size:12px;color:var(--text);padding:6px 8px}
#salap .un{font-size:11.5px;color:var(--muted);margin:0 0 8px}
#salap .pr2{display:flex;gap:8px;align-items:center;margin-bottom:6px}
#salap .pr2 .spacer{flex:1}
.pchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.pchip{border:1px solid;border-radius:99px;padding:2px 9px;font-size:12px;color:var(--text)}
.sm.on{border-color:var(--accent);color:var(--accent)}
.tb .ct.enumt{fill:var(--accent);font-weight:600;cursor:help}
.etip{position:fixed;z-index:110;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.45);pointer-events:none;font:13px system-ui,sans-serif;color:var(--text)}
.etip[hidden]{display:none}
.rowhit{fill:rgba(0,0,0,.001);cursor:grab}
.rowhit:hover{fill:rgba(250,204,21,.08)}
.modal .vl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin-bottom:10px}
.modal textarea{width:100%;min-height:120px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.etip .eh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.etip .eh b{color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.etip .eh span{font-size:11.5px;color:var(--muted)}
.etip .ev{max-height:300px;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.etip .ev div{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--panel2);border-radius:5px;padding:4px 8px;white-space:nowrap}
.rcn{font:700 11px system-ui,sans-serif;paint-order:stroke;stroke:#0a0a0a;stroke-width:3px}
.relhit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.edge{pointer-events:none}
.relhit:hover+.edge{stroke-width:2.6;opacity:1}
#relp{width:300px}
#relp .rl1,#relp .rarr{font-size:12.5px;margin-bottom:4px}
#relp code{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--panel2);padding:1px 5px;border-radius:4px}
#relp .pr2 select{font-size:12px}
.mgr-bg{align-items:center}
.mg{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(860px,96vw);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mg .mh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}
.mg .mtool{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mg .mtool input{flex:1;min-width:200px;padding:6px 9px}
.mg .mlist{overflow:auto;padding:6px 8px;flex:1;min-height:120px}
.mg .mgs{border:1px solid var(--line);border-radius:8px;margin:6px 4px 10px;overflow:hidden}
.mg .mgh{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2)}
.mg .mrow{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 30px;border-top:1px solid var(--line);cursor:pointer}
.mg .mrow:hover{background:var(--accent-soft)}
.mg .mrow .mn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;flex:1}
.mg .pad{padding:8px 30px}
.mg .mfoot{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.mg .mfoot select{padding:5px 8px}
.mg button:disabled{opacity:.4}
.gsearch{position:relative;flex:0 1 340px;min-width:200px}
.gsearch input{width:100%;padding:6px 10px;border-radius:8px}
.gsres{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:360px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:140;padding:4px}
.gsres .gsi{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.gsres .gsi.on{background:var(--accent-soft)}
.gsres .gsi.none{color:var(--muted);cursor:default}
.gsres .gk{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);min-width:56px}
.gsres .gl{font-family:ui-monospace,Menlo,Consolas,monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsres .gd{font-size:11.5px;color:var(--muted);white-space:nowrap}
.fxf{flex:0 0 130px;min-width:0;padding:4px 7px;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="brand">MADB</div>
  <div class="ws">
    <select id="wsSel" aria-label="Arquitetura ativa" data-tip="Trocar de arquitetura"></select>
    <button id="bWsNew" class="sm primary" data-tip="Criar uma nova arquitetura (área de trabalho separada)">+ Nova</button>
    <button id="bWsRen" class="sm ghost" data-tip="Renomear a arquitetura atual">Renomear</button>
    <button id="bWsDup" class="sm ghost" data-tip="Criar uma cópia da arquitetura atual">Duplicar</button>
    <button id="bWsDel" class="sm ghost danger" data-tip="Excluir a arquitetura atual">Excluir</button>
  </div>
  <div class="spacer"></div>
  <div class="gsearch"><input type="text" id="gsQ" placeholder="Buscar tabela, coluna, schema, enum…  (Ctrl+K)" autocomplete="off"><div id="gsRes" class="gsres" hidden></div></div>
  <button id="bShare" class="sm" data-tip="Compartilhar esta arquitetura com um colega (edição em tempo real)">Compartilhar</button>
  <button id="bClear" class="sm ghost danger" data-tip="Apagar todas as tabelas desta arquitetura (pede confirmação)">Esvaziar</button>
  <button id="bUser" class="avatar" data-tip="Seu perfil e preferências" aria-label="Perfil">?</button>
</header>
<div class="userp pop" id="userp" hidden>
  <div class="uh">Seu perfil</div>
  <label class="ul">Nome<input type="text" id="uName" maxlength="60" placeholder="Como você quer aparecer"></label>
  <label class="ul">Paleta de cores<select id="palSel" aria-label="Paleta de cores"></select></label>
  <label class="ul">Servidor de sala<input type="text" id="uSrv" placeholder="wss://madb-sala.seu-usuario.workers.dev"></label>
  <p class="un">Guardado só neste navegador.</p>
</div>
<div class="modal-bg" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <p id="mMsg" class="mmsg"></p>
    <input type="text" id="mInput">
    <div id="mExtra"></div>
    <div class="mact"><button id="mCancel">Cancelar</button><button id="mOk" class="primary">OK</button></div>
  </div>
</div>
<div class="statusbar" id="status">
  <span id="origin"></span>
  <button class="sm ghost" id="bWarn" hidden data-tip="Avisos desta arquitetura (clique para ver ou ocultar)">⚠ 0</button>
  <span class="spacer"></span>
  <button class="sm ghost" id="bOpen" data-tip="Abrir um arquivo .json ou .sql (ou arraste o arquivo para a página)">Abrir arquivo</button>
  <button class="sm ghost" id="bLink" data-tip="Vincular a um arquivo .json para sincronizar" hidden>Vincular</button>
  <button class="sm ghost" id="bReload" data-tip="Ler de novo o arquivo vinculado" hidden>Recarregar</button>
  <button class="sm ghost" id="bSave" data-tip="Gravar esta arquitetura no arquivo vinculado" hidden>Gravar</button>
  <label id="autoW" hidden data-tip="Acompanhar o arquivo vinculado automaticamente"><input type="checkbox" id="optAuto"> Auto</label>
  <input type="file" id="fileIn" accept=".json,.sql,application/json,text/plain" hidden>
</div>
<div class="modal-bg mgr-bg" id="mgr" hidden><div class="mg" role="dialog" aria-label="Schemas e tabelas"></div></div>
<div class="dropov" id="dropov" hidden>Solte o arquivo .json ou .sql para importar</div>
<div class="pop" id="pop" hidden></div>
<div class="pop" id="relp" hidden></div>
<div class="pop userp" id="salap" hidden></div>
<main>
  <aside>
    <div class="sec">Editor <span id="selName" style="text-transform:none;letter-spacing:0;color:var(--text);font-size:13px;margin-left:6px"></span><span class="spacer"></span><button class="sm ghost" id="bClose" title="Fechar editor">×</button></div>
    <div id="editor"></div>
  </aside>
  <div class="right nocode" id="right">
    <div class="canvas-wrap">
      <div class="toolbar">
        <button class="sm primary" id="bAddT" data-tip="Criar uma tabela">+ Tabela</button>
        <button class="sm" id="bModel" data-tip="Schemas, enums, funções e opções do modelo">Modelo</button>
        <button class="sm" id="bSchemas" data-tip="Criar, renomear e excluir schemas; mover tabelas para outro schema">Schemas</button>
        <button class="sm" id="bEnum" data-tip="Criar um tipo enum (lista de valores fixos)">+ Enum</button>
        <button class="sm" id="bLayout" data-tip="Organizar as tabelas em colunas por schema">Organizar</button>
        <button class="sm" id="bFit" data-tip="Enquadrar tudo na tela">Ajustar</button>
        <span class="sep"></span>
        <button class="sm" id="bUndo" data-tip="Desfazer (Ctrl+Z)">↶</button>
        <button class="sm" id="bRedo" data-tip="Refazer (Ctrl+Y)">↷</button>
        <span class="sep"></span>
        <button class="sm" id="bZm" data-tip="Diminuir zoom (ou roda do mouse)">−</button>
        <span id="zl" class="zl">100%</span>
        <button class="sm" id="bZp" data-tip="Aumentar zoom (ou roda do mouse)">+</button>
        <span class="spacer"></span>
        <button class="sm" id="bCode" data-tip="Mostrar ou ocultar o código gerado (SQL, Mermaid, JSON)">Código</button>
      </div>
      <div class="canvas" id="canvas"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
    <div class="warns" id="warns"></div>
    <div class="out">
      <div class="tabs">
        <button class="tab on" data-t="sql">SQL (DDL)</button>
        <button class="tab" data-t="mmd">Mermaid</button>
        <button class="tab" data-t="json">JSON</button>
        <div class="spacer"></div>
        <div class="acts">
          <span id="optIdxW" style="display:flex;gap:8px;align-items:center">
            <label class="opt"><input type="checkbox" id="optIdx"> índices nas FKs</label>
            <label class="opt">nomes <select id="optNaming"><option value="idx">idx_tabela_col</option><option value="ix">ix_tabela__col</option></select></label>
          </span>
          <button class="sm" id="bDown" style="display:none">Baixar .json</button>
          <button class="sm" id="bApply" style="display:none">Aplicar JSON colado</button>
          <button class="sm primary" id="bCopy">Copiar</button>
        </div>
      </div>
      <div class="imp" id="imp" hidden></div>
      <textarea class="code" id="code" spellcheck="false" readonly></textarea>
    </div>
  </div>
</main>
<script src="madb-core.js"></script>
<datalist id="fns"></datalist>
<datalist id="types">
  <option>serial</option><option>bigserial</option><option>smallint</option><option>integer</option><option>bigint</option>
  <option>numeric(12,2)</option><option>real</option><option>double precision</option><option>boolean</option>
  <option>text</option><option>varchar(255)</option><option>char(1)</option><option>date</option><option>time</option>
  <option>timestamp</option><option>timestamptz</option><option>uuid</option><option>jsonb</option><option>json</option>
  <option>bytea</option><option>inet</option><option>integer[]</option><option>text[]</option>
</datalist>
<script>
'use strict';
const W=230,HH=34,RH=22,HEAD=44,COLGAP=70,TGAP=40;
let warnKey='',warnsHidden=true,lastWarnText='';
const WARN_SEEN={};let WARN_FORCE=false;
let needFit=true,dim={w:320,h:240},ctr={x:0,y:0},panX=0,panY=0;
const DEL=MADB.DEL_ACTIONS;
let S=MADB.emptyModel(),sel=null,zoom=1,tab='sql';
let idN=0;const nid=()=>'w'+Date.now().toString(36)+(++idN)+Math.random().toString(36).slice(2,5);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tOf=id=>MADB.tableById(S,id);
const cOf=(t,id)=>MADB.colById(t,id);
const baseType=MADB.baseType;
const MODEL='__model';
const drafts={};   // textos digitados que ainda não viraram dados válidos
const BASE_TYPES=$('#types').innerHTML;

/* ---------- criação ---------- */
function mkTable(name,x,y,schema){const t={id:MADB.newId(S,'table'),name,schema:schema||'public',x,y,cols:[]};S.tables.push(t);return t}
function mkCol(t,name,type,o){const c=Object.assign({id:MADB.newId(S,'col',t),name,type,pk:false,nn:false,uq:false,def:'',ref:null,del:'NO ACTION'},o||{});t.cols.push(c);return c}
function sample(){
  S=MADB.emptyModel();
  const cli=mkTable('clientes',40,40),prod=mkTable('produtos',40,260),ped=mkTable('pedidos',380,40),it=mkTable('itens_pedido',380,300);
  const cid=mkCol(cli,'id','bigint',{pk:true,nn:true,identity:'ALWAYS'});mkCol(cli,'nome','varchar(120)',{nn:true});
  mkCol(cli,'email','varchar(255)',{nn:true,uq:true});mkCol(cli,'criado_em','timestamptz',{nn:true,def:'now()'});
  const pid=mkCol(prod,'id','bigint',{pk:true,nn:true,identity:'ALWAYS'});mkCol(prod,'sku','varchar(40)',{nn:true,uq:true});
  mkCol(prod,'descricao','text');mkCol(prod,'preco','numeric(12,2)',{nn:true,def:'0'});mkCol(prod,'ativo','boolean',{nn:true,def:'true'});
  const oid=mkCol(ped,'id','bigint',{pk:true,nn:true,identity:'ALWAYS'});
  mkCol(ped,'cliente_id','bigint',{nn:true,ref:{t:cli.id,c:cid.id},del:'RESTRICT'});
  mkCol(ped,'status','varchar(20)',{nn:true,def:"'aberto'"});mkCol(ped,'total','numeric(12,2)',{nn:true,def:'0'});
  mkCol(ped,'criado_em','timestamptz',{nn:true,def:'now()'});
  mkCol(it,'pedido_id','bigint',{pk:true,nn:true,ref:{t:ped.id,c:oid.id},del:'CASCADE'});
  mkCol(it,'produto_id','bigint',{pk:true,nn:true,ref:{t:prod.id,c:pid.id},del:'RESTRICT'});
  mkCol(it,'quantidade','integer',{nn:true,def:'1'});mkCol(it,'preco_unit','numeric(12,2)',{nn:true});
  it.constraints=[{id:MADB.newId(S,'constraint',it),name:'ck_itens_pedido__quantidade',kind:'check',expr:'quantidade > 0'}];
  return S;
}

/* ---------- listas de colunas em texto ---------- */
const colNames=(t,ids)=>ids.map(i=>{const c=cOf(t,i);return c?c.name:'?'}).join(', ');
function parseColList(t,text){
  const names=String(text).split(',').map(x=>x.trim()).filter(Boolean),ids=[],bad=[];
  names.forEach(n=>{const c=t.cols.find(c=>c.name===n);if(c)ids.push(c.id);else bad.push(n)});
  if(!names.length)bad.push('(vazio)');
  return {ids,bad};
}
function splitTop(s){const out=[];let d=0,cur='';for(const ch of s){if(ch==='(')d++;if(ch===')')d--;if(ch===','&&d===0){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim()).filter(Boolean)}
function parseIdxCols(t,text){
  const cols=[],bad=[];
  splitTop(text).forEach(tok=>{
    if(tok.startsWith('(')&&tok.endsWith(')')){cols.push({expr:tok.slice(1,-1).trim()});return}
    const m=tok.match(/^(\S+?)(?:\s+(ASC|DESC))?(?:\s+NULLS\s+(FIRST|LAST))?$/i);
    const c=m&&t.cols.find(c=>c.name===m[1]);
    if(!c){bad.push(tok);return}
    const e={c:c.id};if(m[2])e.order=m[2].toUpperCase();if(m[3])e.nulls=m[3].toUpperCase();cols.push(e);
  });
  if(!cols.length&&!bad.length)bad.push('(vazio)');
  return {cols,bad};
}
const fmtIdxCols=(t,cols)=>cols.map(e=>e.expr?`(${e.expr})`:(cOf(t,e.c)?cOf(t,e.c).name:'?')+(e.order?' '+e.order:'')+(e.nulls?' NULLS '+e.nulls:'')).join(', ');
const dv=(key,fallback)=>key in drafts?drafts[key]:fallback;

/* ---------- desfazer / refazer ---------- */
const HIST={u:[],r:[]};let histKey=null,histT=0;
function updateHistBtns(){
  const a=$('#bUndo'),b=$('#bRedo');
  if(a)a.disabled=!HIST.u.length;if(b)b.disabled=!HIST.r.length;
}
/* guarda o estado ANTES de uma mudança; digitação no mesmo campo vira uma só entrada */
function histBefore(key){
  const now=Date.now();
  if(key!==null&&key===histKey&&now-histT<1500){histT=now;return}
  histKey=key;histT=now;
  const snap=JSON.stringify(S);
  if(HIST.u.length&&HIST.u[HIST.u.length-1]===snap)return;
  HIST.u.push(snap);if(HIST.u.length>100)HIST.u.shift();
  HIST.r=[];updateHistBtns();
}
function clearHist(){HIST.u=[];HIST.r=[];histKey=null;updateHistBtns()}
function applyHist(){
  histKey=null;
  if(sel!==null&&sel!==MODEL&&!tOf(sel))sel=null;
  closePop();renderAll();updateHistBtns();
}
function undo(){
  const cur0=JSON.stringify(S);
  while(HIST.u.length&&HIST.u[HIST.u.length-1]===cur0)HIST.u.pop();
  if(!HIST.u.length)return;
  HIST.r.push(cur0);S=JSON.parse(HIST.u.pop());applyHist();
}
function redo(){
  const cur0=JSON.stringify(S);
  while(HIST.r.length&&HIST.r[HIST.r.length-1]===cur0)HIST.r.pop();
  if(!HIST.r.length)return;
  HIST.u.push(cur0);S=JSON.parse(HIST.r.pop());applyHist();
}
/* confirmação antes de qualquer exclusão */
function confirmDel(what,fn){
  openModal({title:'Confirmar exclusão',input:false,danger:true,ok:'Excluir',
    msg:`Excluir ${what}? Você pode desfazer depois com Ctrl+Z.`,
    onOk:()=>{histBefore(null);fn()}});
}
function delLabel(a,btn){
  const t=tOf(sel);
  if(a==='delT')return `a tabela "${t?t.name:''}" e tudo que está nela`;
  if(a==='delC'){const c=t&&cOf(t,btn.closest('.col').dataset.cid);return `a coluna "${c?c.name:''}"`}
  return ({delK:'esta restrição',delI:'este índice',delG:'este trigger',delP:'esta partição',delS:'este schema',delE:'este enum',delF:'esta função'})[a]||'este item';
}
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden)return;
  const tag=e.target.tagName||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.target.isContentEditable)return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if((e.key==='Delete'||e.key==='Backspace')&&!mod&&sel!==null&&sel!==MODEL&&tOf(sel)){
    e.preventDefault();
    confirmDel(delLabel('delT'),()=>act('delT'));
    return;
  }
  if(mod&&!e.shiftKey&&k==='c'&&sel!==null&&sel!==MODEL&&tOf(sel)){copiarTabela(tOf(sel))}
  else if(mod&&!e.shiftKey&&k==='z'){e.preventDefault();undo()}
  else if(mod&&(k==='y'||(e.shiftKey&&k==='z'))){e.preventDefault();redo()}
});
$('#bUndo').onclick=undo;
$('#bRedo').onclick=redo;
updateHistBtns();

/* ---------- editor ---------- */
function refOptions(t,c,filtro){
  const f=(filtro||'').toLowerCase();
  let o='<option value="">— sem chave estrangeira —</option>';
  S.tables.forEach(x=>{x.cols.forEach(y=>{
    if(x.id===t.id&&y.id===c.id)return;
    const v=x.id+'|'+y.id, on=c.ref&&c.ref.t===x.id&&c.ref.c===y.id;
    const txt=(x.schema||'public')+'.'+x.name+'.'+y.name;
    if(f&&!on&&!txt.toLowerCase().includes(f))return;
    o+='<option value="'+v+'"'+(on?' selected':'')+'>→ '+esc(txt)+(y.pk?' (PK)':'')+'</option>';
  });});
  return o;
}
const optList=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
function updateDatalists(){
  $('#types').innerHTML=BASE_TYPES+S.enums.map(e=>`<option>${esc(e.schema==='public'?e.name:e.schema+'.'+e.name)}</option>`).join('');
  $('#fns').innerHTML=S.functions.map(f=>`<option>${esc(f.schema+'.'+f.name)}</option>`).join('');
}
function conHTML(t,k){
  const d=(f,v)=>esc(dv(k.id+':'+f,v)), bad=drafts[k.id+':bad']?`<span class="bad">${esc(drafts[k.id+':bad'])}</span>`:'';
  let b='';
  if(k.kind==='check')b=`<div class="r"><input type="text" data-f="cexpr" value="${esc(k.expr||'')}" placeholder="expressão, ex.: quantidade > 0"></div>`;
  else if(k.kind==='unique')b=`<div class="r"><input type="text" data-f="ccols" value="${d('ccols',colNames(t,k.cols))}" placeholder="colunas, separadas por vírgula"><label><input type="checkbox" data-f="cnnd" ${k.nullsNotDistinct?'checked':''}>NULLS NOT DISTINCT</label></div>${bad}`;
  else{
    const rt=tOf(k.ref.t);
    b=`<div class="r"><input type="text" data-f="ccols" value="${d('ccols',colNames(t,k.cols))}" placeholder="colunas desta tabela"></div>
    <div class="r"><input type="text" data-fx="tabfilter" placeholder="filtrar tabela…" class="fxf"><select data-f="creft">${tabOptions(k.ref.t)}</select>
      <input type="text" data-f="crefcols" value="${d('crefcols',rt?colNames(rt,k.ref.cols):'')}" placeholder="colunas referenciadas">
      <select data-f="cdel" title="ON DELETE">${optList(DEL,k.del)}</select></div>${bad}`;
  }
  return `<div class="sub" data-k="con" data-id="${k.id}"><div class="r"><select data-f="ckind">${['check','unique','fk'].map(x=>`<option value="${x}" ${x===k.kind?'selected':''}>${x==='fk'?'FK composta':x.toUpperCase()}</option>`).join('')}</select>
    <input type="text" data-f="cname" value="${esc(k.name||'')}" placeholder="nome da restrição"><button class="sm danger" data-a="delK" title="Remover">✕</button></div>${b}</div>`;
}
function idxHTML(t,x){
  const bad=drafts[x.id+':bad']?`<span class="bad">${esc(drafts[x.id+':bad'])}</span>`:'';
  return `<div class="sub" data-k="idx" data-id="${x.id}"><div class="r"><input type="text" data-f="iname" value="${esc(x.name)}" placeholder="nome do índice"><button class="sm danger" data-a="delI" title="Remover">✕</button></div>
  <div class="r"><input type="text" data-f="icols" value="${esc(dv(x.id+':icols',fmtIdxCols(t,x.cols)))}" placeholder="colunas: a, b DESC NULLS LAST, (lower(c))"></div>${bad}
  <div class="r"><input type="text" data-f="iwhere" value="${esc(x.where||'')}" placeholder="WHERE (índice parcial)">
    <input type="text" data-f="imethod" value="${esc(x.method||'')}" placeholder="método (btree)" style="max-width:110px"></div>
  <div class="r"><label><input type="checkbox" data-f="iuq" ${x.unique?'checked':''}>UNIQUE</label><label><input type="checkbox" data-f="innd" ${x.nullsNotDistinct?'checked':''}>NULLS NOT DISTINCT</label></div></div>`;
}
function trgHTML(t,g){
  return `<div class="sub" data-k="trg" data-id="${g.id}"><div class="r"><input type="text" data-f="gname" value="${esc(g.name)}" placeholder="nome do trigger"><button class="sm danger" data-a="delG" title="Remover">✕</button></div>
  <div class="r"><select data-f="gtiming">${optList(MADB.TRIGGER_TIMING,g.timing)}</select><select data-f="glevel">${optList(['ROW','STATEMENT'],g.level)}</select></div>
  <div class="r">${MADB.TRIGGER_EVENTS.map(e=>`<label><input type="checkbox" data-f="gev" value="${e}" ${g.events.includes(e)?'checked':''}>${e}</label>`).join('')}</div>
  <div class="r"><input type="text" list="fns" data-f="gfn" value="${esc(g.function)}" placeholder="schema.função"><input type="text" data-f="gwhen" value="${esc(g.when||'')}" placeholder="WHEN (opcional)"></div></div>`;
}
function partHTML(t){
  const p=t.partition;
  let h=`<div class="r"><select data-f="pby"><option value="">Sem partição</option>${optList(MADB.PARTITION_METHODS,p&&p.by)}</select>
    ${p?`<input type="text" data-f="pcols" value="${esc(dv(t.id+':pcols',colNames(t,p.cols)))}" placeholder="coluna(s) de partição">`:''}</div>${drafts[t.id+':bad']?`<span class="bad">${esc(drafts[t.id+':bad'])}</span>`:''}`;
  if(p){
    h+=(t.partitions||[]).map(x=>`<div class="sub" data-k="par" data-id="${x.id}"><div class="r"><input type="text" data-f="xname" value="${esc(x.name)}" placeholder="nome da partição"><button class="sm danger" data-a="delP" title="Remover">✕</button></div>
      <div class="r"><input type="text" data-f="xbound" value="${esc(x.bound)}" placeholder="FROM ('2026-01-01') TO ('2026-02-01')"></div></div>`).join('');
    h+=`<button class="sm" data-a="addP">+ Partição filha</button>`;
  }
  return h;
}
function colHTML(t,c){
  return `<div class="col" data-cid="${c.id}">
    <div class="l1"><input class="nm" type="text" data-f="name" value="${esc(c.name)}" placeholder="nome">
      <input class="ty" type="text" list="types" data-f="type" value="${esc(c.type)}" placeholder="tipo">
      <button class="sm danger" data-a="delC" title="Remover coluna">✕</button></div>
    <div class="l2">
      <label><input type="checkbox" data-f="pk" ${c.pk?'checked':''}>PK</label>
      <label><input type="checkbox" data-f="nn" ${c.nn||c.pk?'checked':''} ${c.pk?'disabled':''}>NOT NULL</label>
      <label><input type="checkbox" data-f="uq" ${c.uq?'checked':''}>UNIQUE</label>
      <input class="df" type="text" data-f="def" value="${esc(c.def)}" placeholder="DEFAULT">
    </div>
    <div class="l3"><input type="text" data-fx="reffilter" placeholder="filtrar…" class="fxf"><select data-f="ref">${refOptions(t,c)}</select>
      ${c.ref?`<select data-f="del" title="ON DELETE">${optList(DEL,c.del)}</select>`:''}</div>
    <details class="more" ${(c.identity||c.generated||c.comment)?'open':''}><summary>identity · gerada · comentário</summary>
      <div class="r"><select data-f="identity"><option value="">sem identity</option>${optList(['ALWAYS','BY DEFAULT'],c.identity)}</select>
        <input type="text" data-f="generated" value="${esc(c.generated||'')}" placeholder="coluna gerada: expressão"></div>
      <div class="r"><input type="text" data-f="comment" value="${esc(c.comment||'')}" placeholder="comentário da coluna"></div></details>
  </div>`;
}
function modelHTML(){
  return `<div class="sec">Opções</div>
  <div class="row"><label style="min-width:90px">Nomes de índice</label><select data-g="naming">${['idx','ix'].map(v=>`<option value="${v}" ${((S.options&&S.options.indexNaming)||'idx')===v?'selected':''}>${v==='idx'?'idx_tabela_coluna':'ix_tabela__coluna'}</option>`).join('')}</select></div>
  <div class="sec" style="margin-top:14px">Schemas <span class="spacer"></span><button class="sm primary" data-a="addS">+ Schema</button></div>
  ${(S.schemas||[]).map((s,i)=>`<div class="sub" data-k="sch" data-i="${i}"><div class="r"><input type="text" data-f="sname" value="${esc(s.name)}" placeholder="nome"><button class="sm danger" data-a="delS">✕</button></div>
    <div class="r"><input type="text" data-f="scomment" value="${esc(s.comment||'')}" placeholder="comentário"></div></div>`).join('')||'<div class="empty" style="padding:4px">Schemas usados por tabelas já são criados sozinhos.</div>'}
  <div class="sec" style="margin-top:14px">Enums <span class="spacer"></span><button class="sm primary" data-a="addE">+ Enum</button></div>
  ${S.enums.map(e=>`<div class="sub" data-k="enum" data-id="${e.id}"><div class="r"><input type="text" data-f="schema" value="${esc(e.schema)}" placeholder="schema" style="max-width:90px"><input type="text" data-f="ename" value="${esc(e.name)}" placeholder="nome"><button class="sm danger" data-a="delE">✕</button></div>
    <textarea data-f="evalues" placeholder="um valor por linha" spellcheck="false">${esc(e.values.join('\n'))}</textarea>
    <div class="r"><input type="text" data-f="ecomment" value="${esc(e.comment||'')}" placeholder="comentário"></div></div>`).join('')||'<div class="empty" style="padding:4px">Nenhum enum.</div>'}
  <div class="sec" style="margin-top:14px">Funções <span class="spacer"></span><button class="sm primary" data-a="addF">+ Função</button></div>
  ${S.functions.map(f=>`<div class="sub" data-k="fn" data-id="${f.id}"><div class="r"><input type="text" data-f="schema" value="${esc(f.schema)}" placeholder="schema" style="max-width:90px"><input type="text" data-f="fname" value="${esc(f.name)}" placeholder="nome"><button class="sm danger" data-a="delF">✕</button></div>
    <textarea data-f="fsql" placeholder="CREATE OR REPLACE FUNCTION ..." spellcheck="false" style="min-height:110px">${esc(f.sql)}</textarea>
    <div class="r"><input type="text" data-f="fcomment" value="${esc(f.comment||'')}" placeholder="comentário"></div></div>`).join('')||'<div class="empty" style="padding:4px">Nenhuma função (usadas por triggers).</div>'}`;
}
function renderEditor(){
  updateDatalists();
  const ed=$('#editor');
  if(sel!==null&&sel!==MODEL&&!tOf(sel)){sel=null;closePop()}
  const open=sel!==null;
  $('main').classList.toggle('open',open);
  if(!open){ed.innerHTML='';$('#selName').textContent='';return}
  if(sel===MODEL){$('#selName').textContent='Modelo';ed.innerHTML=modelHTML();return}
  const t=tOf(sel);
  $('#selName').textContent=t.name;
  ed.innerHTML=`
  <div class="sec">Tabela</div>
  <div class="row"><label>Nome</label><input type="text" data-f="tname" value="${esc(t.name)}"></div>
  <div class="row"><label>Schema</label><input type="text" data-f="tschema" value="${esc(t.schema)}">
    <button class="sm danger" data-a="delT">Excluir tabela</button></div>
  <div class="row"><label>Coment.</label><input type="text" data-f="tcomment" value="${esc(t.comment||'')}" placeholder="COMMENT ON TABLE"></div>

function prune(){const l=MADB.prune(S);if(l.length)setNotice('Limpeza automática: '+l.join('; '))}
function setNotice(msg){$('#warns').dataset.notice=msg}
const emptyDel=(o,k)=>{if(o[k]&&!o[k].length)delete o[k]};

/* edição por input (sem re-render, para não perder o foco) */
$('#editor').addEventListener('input',e=>{
  if(e.target.dataset.f)histBefore(e.target);
  const el=e.target,f=el.dataset.f,g=el.dataset.g;
  if(g==='naming')return;
  if(!f)return;
  if(sel===MODEL)return modelInput(el,f);
  const t=tOf(sel);if(!t)return;
  const sub=el.closest('.sub'),col=el.closest('.col');
  if(f==='tname'){t.name=el.value;$('#selName').textContent=t.name;renderOut();return}
  if(f==='tschema'){t.schema=el.value.trim()||'public';renderOut();return}
  if(f==='tcomment'){if(el.value)t.comment=el.value;else delete t.comment;renderOut(true);return}
  if(col){
    const c=cOf(t,col.dataset.cid);if(!c)return;
    if(['name','type','def'].includes(f)){c[f]=el.value;renderOut()}
    else if(f==='generated'){if(el.value)c.generated=el.value;else delete c.generated;renderOut(true)}
    else if(f==='comment'){if(el.value)c.comment=el.value;else delete c.comment;renderOut(true)}
    return;
  }
  if(!sub)return;
  const id=sub.dataset.id,k=sub.dataset.k;
  if(k==='con'){const o=(t.constraints||[]).find(x=>x.id===id);if(!o)return;
    if(f==='cname')o.name=el.value;else if(f==='cexpr')o.expr=el.value;
    else if(f==='ccols'||f==='crefcols'){drafts[id+':'+f]=el.value;return}
    renderOut(true)}
  else if(k==='idx'){const o=(t.indexes||[]).find(x=>x.id===id);if(!o)return;
    if(f==='iname')o.name=el.value;
    else if(f==='iwhere'){if(el.value)o.where=el.value;else delete o.where}
    else if(f==='imethod'){if(el.value)o.method=el.value;else delete o.method}
    else if(f==='icols'){drafts[id+':icols']=el.value;return}
    renderOut(true)}
  else if(k==='trg'){const o=(t.triggers||[]).find(x=>x.id===id);if(!o)return;
    if(f==='gname')o.name=el.value;else if(f==='gfn')o.function=el.value;
    else if(f==='gwhen'){if(el.value)o.when=el.value;else delete o.when}
    renderOut(true)}
  else if(k==='par'){const o=(t.partitions||[]).find(x=>x.id===id);if(!o)return;
    if(f==='xname')o.name=el.value;else if(f==='xbound')o.bound=el.value;
    renderOut(true)}
  if(f==='pcols'){drafts[t.id+':pcols']=el.value}
});
function modelInput(el,f){
  const sub=el.closest('.sub');if(!sub)return;
  const k=sub.dataset.k;
  if(k==='sch'){const s=S.schemas[+sub.dataset.i];if(!s)return;
    if(f==='sname')s.name=el.value;else if(f==='scomment'){if(el.value)s.comment=el.value;else delete s.comment}}
  else if(k==='enum'){const o=S.enums.find(x=>x.id===sub.dataset.id);if(!o)return;
    if(f==='schema')o.schema=el.value.trim()||'public';else if(f==='ename')o.name=el.value;
    else if(f==='evalues')o.values=el.value.split('\n').map(x=>x.trim()).filter(Boolean);
    else if(f==='ecomment'){if(el.value)o.comment=el.value;else delete o.comment}}
  else if(k==='fn'){const o=S.functions.find(x=>x.id===sub.dataset.id);if(!o)return;
    if(f==='schema')o.schema=el.value.trim()||'public';else if(f==='fname')o.name=el.value;
    else if(f==='fsql')o.sql=el.value;else if(f==='fcomment'){if(el.value)o.comment=el.value;else delete o.comment}}
  renderOut(true);
}
/* edição por change (pode re-renderizar) */
$('#editor').addEventListener('change',e=>{
  histBefore(null);
  const el=e.target,f=el.dataset.f,g=el.dataset.g;
  if(g==='naming'){S.options=Object.assign({},S.options,{indexNaming:el.value});syncNaming();renderOut(true);return}
  if(!f)return;
  if(sel===MODEL){renderEditor();return}
  const t=tOf(sel);if(!t)return;
  const sub=el.closest('.sub'),col=el.closest('.col');
  if(['tname','tschema','name'].includes(f)){renderEditor();renderOut();return}
  if(col){
    const c=cOf(t,col.dataset.cid);if(!c)return;
    if(f==='pk'){c.pk=el.checked;if(c.pk)c.nn=true}
    else if(f==='nn'||f==='uq')c[f]=el.checked;
    else if(f==='ref'){const v=el.value;if(!v)c.ref=null;else{const [a,b]=v.split('|');c.ref={t:a,c:b};
        const rc=cOf(tOf(a),b);if(rc&&(!c.type||c.type==='text'))c.type=baseType(rc.type)}}
    else if(f==='del')c.del=el.value;
    else if(f==='identity'){if(el.value)c.identity=el.value;else delete c.identity}
    renderAll();return;
  }
  if(f==='pby'){
    if(!el.value){delete t.partition;delete t.partitions}
    else if(!t.partition){const pk=t.cols.filter(c=>c.pk);t.partition={by:el.value,cols:(pk[pk.length-1]||t.cols[0]||{}).id?[(pk[pk.length-1]||t.cols[0]).id]:[]}}
    else t.partition.by=el.value;
    renderAll();return;
  }
  if(f==='pcols'){const r=parseColList(t,el.value);
    if(r.bad.length)drafts[t.id+':bad']='Coluna(s) que não existem em "'+t.name+'": '+r.bad.join(', ');
    else{t.partition.cols=r.ids;delete drafts[t.id+':bad'];delete drafts[t.id+':pcols']}
    renderAll();return;}
  if(!sub)return;
  const id=sub.dataset.id,k=sub.dataset.k;
  if(k==='con'){const o=(t.constraints||[]).find(x=>x.id===id);if(!o)return;
    if(f==='ckind'){
      delete o.expr;delete o.cols;delete o.ref;delete o.del;delete o.nullsNotDistinct;o.kind=el.value;
      Object.keys(drafts).filter(x=>x.startsWith(id+':')).forEach(x=>delete drafts[x]);
      if(o.kind==='check')o.expr='';
      else{o.cols=[];if(o.kind==='fk'){const rt=S.tables.find(x=>x.id!==t.id)||t;o.ref={t:rt.id,cols:[]};o.del='NO ACTION'}}
    }
    else if(f==='cnnd'){if(el.checked)o.nullsNotDistinct=true;else delete o.nullsNotDistinct}
    else if(f==='cdel')o.del=el.value;
    else if(f==='creft'){o.ref={t:el.value,cols:[]};delete drafts[id+':crefcols'];delete drafts[id+':bad']}
    else if(f==='ccols'||f==='crefcols'){
      const target=f==='ccols'?t:tOf(o.ref.t),r=parseColList(target,el.value);
      if(r.bad.length)drafts[id+':bad']='Coluna(s) que não existem em "'+target.name+'": '+r.bad.join(', ');
      else{if(f==='ccols')o.cols=r.ids;else o.ref.cols=r.ids;delete drafts[id+':bad'];delete drafts[id+':'+f]}
    }
    renderAll();return}
  if(k==='idx'){const o=(t.indexes||[]).find(x=>x.id===id);if(!o)return;
    if(f==='iuq'){if(el.checked)o.unique=true;else delete o.unique}
    else if(f==='innd'){if(el.checked)o.nullsNotDistinct=true;else delete o.nullsNotDistinct}
    else if(f==='icols'){const r=parseIdxCols(t,el.value);
      if(r.bad.length)drafts[id+':bad']='Não entendi: '+r.bad.join(' | ')+' (use nomes de colunas desta tabela ou (expressão))';
      else{o.cols=r.cols;delete drafts[id+':bad'];delete drafts[id+':icols']}}
    renderAll();return}
  if(k==='trg'){const o=(t.triggers||[]).find(x=>x.id===id);if(!o)return;
    if(f==='gtiming')o.timing=el.value;else if(f==='glevel')o.level=el.value;
    else if(f==='gev'){o.events=MADB.TRIGGER_EVENTS.filter(ev=>sub.querySelector(`[data-f=gev][value="${ev}"]`).checked)}
    renderAll();return}
  renderAll();
});
function act(a,btn,sub){
  if(sel===MODEL){
    if(a==='addS')S.schemas.push({name:'novo_schema'});
    else if(a==='delS')S.schemas.splice(+sub.dataset.i,1);
    else if(a==='addE')S.enums.push({id:MADB.newId(S,'enum'),schema:'public',name:'novo_enum',values:['valor1','valor2']});
    else if(a==='delE')S.enums=S.enums.filter(x=>x.id!==sub.dataset.id);
    else if(a==='addF')S.functions.push({id:MADB.newId(S,'function'),schema:'public',name:'nova_funcao',sql:'CREATE OR REPLACE FUNCTION public.nova_funcao() RETURNS trigger\nLANGUAGE plpgsql AS $$\nBEGIN\n  RETURN NEW;\nEND;\n$$;'});
    else if(a==='delF')S.functions=S.functions.filter(x=>x.id!==sub.dataset.id);
    renderAll();return;
  }
  const t=tOf(sel);if(!t)return;
  if(a==='addC')mkCol(t,'coluna_'+(t.cols.length+1),'text');
  else if(a==='delC'){const id=btn.closest('.col').dataset.cid;t.cols=t.cols.filter(c=>c.id!==id);prune()}
  else if(a==='delT'){S.tables=S.tables.filter(x=>x.id!==t.id);prune();sel=null}
  else if(a==='addK'){(t.constraints=t.constraints||[]).push({id:MADB.newId(S,'constraint',t),name:'',kind:'check',expr:''})}
  else if(a==='delK'){t.constraints=t.constraints.filter(x=>x.id!==sub.dataset.id);emptyDel(t,'constraints')}
  else if(a==='addI'){const pk=t.cols[0];(t.indexes=t.indexes||[]).push({id:MADB.newId(S,'index',t),name:`idx_${t.name}_${(pk&&pk.name)||'col'}`,cols:pk?[{c:pk.id}]:[]})}
  else if(a==='delI'){t.indexes=t.indexes.filter(x=>x.id!==sub.dataset.id);emptyDel(t,'indexes')}
  else if(a==='addG'){(t.triggers=t.triggers||[]).push({id:MADB.newId(S,'trigger',t),name:`tg_${t.name}`,timing:'BEFORE',events:['UPDATE'],level:'ROW',function:S.functions[0]?S.functions[0].schema+'.'+S.functions[0].name:''})}
  else if(a==='delG'){t.triggers=t.triggers.filter(x=>x.id!==sub.dataset.id);emptyDel(t,'triggers')}
  else if(a==='addP'){(t.partitions=t.partitions||[]).push({id:MADB.newId(S,'partition',t),name:`${t.name}_p${t.partitions.length+1}`,bound:t.partition&&t.partition.by==='HASH'?'WITH (MODULUS 4, REMAINDER 0)':t.partition&&t.partition.by==='LIST'?"IN ('A')":"FROM ('2026-01-01') TO ('2026-02-01')"})}
  else if(a==='delP'){t.partitions=t.partitions.filter(x=>x.id!==sub.dataset.id);emptyDel(t,'partitions')}
  renderAll();
}

/* ---------- diagrama ---------- */
const tH=MADB.tableHeight;
const schemaOf=t=>t.schema||'public';
function schemaGroups(){
  const g={};S.tables.forEach(t=>{(g[schemaOf(t)]=g[schemaOf(t)]||[]).push(t)});
  const names=Object.keys(g).sort((a,b)=>a==='public'?-1:b==='public'?1:a.localeCompare(b));
  return names.map(n=>({name:n,tables:g[n]}));
}
/* uma coluna por schema, tabelas empilhadas. force=true reorganiza tudo; senão só posiciona as novas */
function layoutSchemas(force){
  schemaGroups().forEach((grp,i)=>{
    const missing=t=>force||t.x==null||t.y==null;
    const placed=grp.tables.find(t=>!missing(t));
    const x=placed?placed.x:24+i*(W+COLGAP);
    let bottom=HEAD;
    grp.tables.forEach(t=>{if(!missing(t))bottom=Math.max(bottom,t.y+tH(t)+TGAP)});
    grp.tables.forEach(t=>{if(missing(t)){t.x=x;t.y=bottom;bottom+=tH(t)+TGAP}});
  });
}
const rowY=(t,c)=>t.y+HH+t.cols.indexOf(c)*RH+RH/2;
function edge(s,c,t,rc,many,key){
  const y1=rowY(s,c),y2=rowY(t,rc);
  const right=(s.x+W/2)<=(t.x+W/2);
  let x1,x2,d1,d2;
  if(s===t){x1=s.x+W;x2=s.x+W;d1=1;d2=1}
  else if(right){x1=s.x+W;x2=t.x;d1=1;d2=-1}
  else{x1=s.x;x2=t.x+W;d1=-1;d2=1}
  const k=s===t?60:Math.max(40,Math.abs(x2-x1)/2);
  const d=`M${x1},${y1} C${x1+d1*k},${y1} ${x2+d2*k},${y2} ${x2},${y2}`;
  return `<path class="relhit" data-rel="${key}" d="${d}"/><path class="edge" d="${d}"/>
  <text class="card" x="${x1+d1*12-(d1<0?4:0)}" y="${y1-5}" text-anchor="${d1>0?'start':'end'}">${many?'N':'1'}</text>
  <text class="card" x="${x2+d2*12-(d2<0?4:0)}" y="${y2-5}" text-anchor="${d2>0?'start':'end'}">1</text>`;
}
function fitZoom(){
  const c=$('#canvas');const aw=c.clientWidth||800,ah=c.clientHeight||600;
  zoom=+Math.max(.2,Math.min(1.5,aw/dim.w,ah/dim.h)).toFixed(3);
  panX=aw/2-ctr.x*zoom;panY=ah/2-ctr.y*zoom;
}
function renderDiagram(){
  layoutSchemas(false);
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  S.tables.forEach(t=>{
    const extra=t.id===sel;
    x0=Math.min(x0,t.x);y0=Math.min(y0,t.y);
    x1=Math.max(x1,t.x+W+(extra?40:0));y1=Math.max(y1,t.y+tH(t)+(extra?76:0));
  });
  if(!S.tables.length){x0=0;y0=0;x1=320;y1=240}
  const cw=x1-x0,ch=y1-y0;
  dim={w:cw+60,h:ch+60};
  ctr={x:(x0+x1)/2,y:(y0+y1)/2};
  const wasFit=needFit&&S.tables.length>0;
  if(wasFit){fitZoom();needFit=false}
  const svg=$('#svg');
  let o='';
  if(!S.tables.length){
    o='<text x="30" y="50" fill="currentColor" opacity=".5" font-size="14">Adicione uma tabela ou importe um JSON para começar o diagrama.</text>';
    svg.innerHTML=worldG(o);applyView();return;
  }
  const enumNames=new Set(S.enums.flatMap(e=>[e.name,(e.schema||'public')+'.'+e.name]));
  schemaGroups().forEach(grp=>{
    const x=Math.min(...grp.tables.map(t=>t.x)),y=Math.min(...grp.tables.map(t=>t.y))-12;
    o+=`<text class="schl" x="${x}" y="${y}">${esc(grp.name)} · ${grp.tables.length}</text>`;
  });
  S.tables.forEach(s=>{
    s.cols.forEach(c=>{
      if(!c.ref)return;
      const t=tOf(c.ref.t),rc=cOf(t,c.ref.c);if(!t||!rc)return;
      o+=edge(s,c,t,rc,!(c.uq||c.pk&&s.cols.filter(z=>z.pk).length===1),'col|'+s.id+'|'+c.id);
    });
    (s.constraints||[]).forEach(k=>{
      if(k.kind!=='fk')return;
      const t=tOf(k.ref.t),c=cOf(s,k.cols[0]),rc=cOf(t,k.ref.cols[0]);if(!t||!c||!rc)return;
      o+=edge(s,c,t,rc,true,'con|'+s.id+'|'+k.id);
    });
  });
  S.tables.forEach(t=>{
    const h=tH(t),nChk=(t.constraints||[]).filter(k=>k.kind==='check').length,nFk=(t.constraints||[]).filter(k=>k.kind==='fk').length,nTrg=(t.triggers||[]).length;
    const sub=[t.partition?'particionada':'',nChk?nChk+' check':'',nFk?nFk+' FK comp.':'',nTrg?nTrg+' trigger':''].filter(Boolean).join(' · ');
    const compFk=new Set();(t.constraints||[]).forEach(k=>{if(k.kind==='fk')k.cols.forEach(i=>compFk.add(i))});
    o+=`<g class="tb ${t.id===sel?'sel':''}" data-id="${t.id}" transform="translate(${t.x},${t.y})">
      <rect class="body" width="${W}" height="${h}" rx="7"/>
      <path class="hd" d="M0,7 a7,7 0 0 1 7,-7 h${W-14} a7,7 0 0 1 7,7 v${HH-7} h-${W} z"/>
      <text class="ht" x="12" y="${sub?15:21}">${esc(t.name)}</text>
      ${sub?`<text class="hs" x="12" y="28">${esc(sub)}</text>`:''}`;
    t.cols.forEach((c,i)=>{
      const y=HH+i*RH;
      if(i)o+=`<line class="rl" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`;
      const fk=c.ref||compFk.has(c.id);
      const tag=c.pk&&fk?'PK·FK':c.pk?'PK':fk?'FK':'';
      o+=`<text class="${c.pk?'tag-pk':'tag-fk'}" x="10" y="${y+15}">${tag}</text>
      <text class="cn" x="${tag?(tag.length>2?44:28):12}" y="${y+15}" ${c.pk?'font-weight="600"':''}>${esc(c.name)}${(c.nn||c.pk)?'':'?'}</text>
      <text class="ct${enumNames.has(c.type)?' enumt':''}" ${enumNames.has(c.type)?`data-enum="${esc(c.type)}"`:''} x="${W-10}" y="${y+15}" text-anchor="end">${enumNames.has(c.type)?'◆ ':''}${esc(c.type.length>16?c.type.slice(0,15)+'…':c.type)}</text>`;
    });
    o+='</g>';
  });
  /* botões flutuantes da tabela selecionada (fora do grupo, para não arrastar a tabela) */
  const st=tOf(sel);
  if(st){
    st.cols.forEach((c,i)=>{
      o+=`<rect class="rowhit" data-a="pickCol" data-cid="${c.id}" x="${st.x}" y="${st.y+HH+i*RH}" width="${W}" height="${RH}"/>`;
      o+=`<g class="fab" data-a="pickCol" data-cid="${c.id}" transform="translate(${st.x+W+8},${st.y+HH+i*RH+3})"><title>Editar coluna</title><circle cx="9" cy="9" r="9"/><text x="9" y="13" text-anchor="middle">✎</text></g>`;
    });
    o+=`<g class="fab pill" data-a="addCol" transform="translate(${st.x+W/2-46},${st.y+tH(st)+8})"><rect width="92" height="22" rx="11"/><text x="46" y="15" text-anchor="middle">+ coluna</text></g>`;
    const QK=[["chk","+ CHECK"],["fk","+ FK composta"],["trg","+ trigger"],["part","+ partição"]].map(([k,l])=>({k,l,w:Math.round(l.length*6.4+22)}));
    const tot=QK.reduce((a,b)=>a+b.w,0)+(QK.length-1)*6;let qx=st.x+W/2-tot/2;
    QK.forEach(q=>{o+=`<g class="fab pill" data-a="quick" data-q="${q.k}" transform="translate(${qx},${st.y+tH(st)+36})"><rect width="${q.w}" height="22" rx="11"/><text x="${q.w/2}" y="15" text-anchor="middle">${q.l}</text></g>`;qx+=q.w+6});
  }
  svg.innerHTML=worldG(o);applyView();
}
let drag=null;
$('#svg').addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('[data-a]'))return;
  const g=e.target.closest('.tb');if(!g)return;
  const t=tOf(g.dataset.id);if(!t)return;
  drag={id:t.id,sx:e.clientX,sy:e.clientY,ox:t.x,oy:t.y,moved:false};
  e.preventDefault();
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  const t=tOf(drag.id);const dx=(e.clientX-drag.sx)/zoom,dy=(e.clientY-drag.sy)/zoom;
  if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
  if(!drag.moved)return;
  if(!drag.hist){histBefore(null);drag.hist=true}
  t.x=Math.round(drag.ox+dx);t.y=Math.round(drag.oy+dy);
  renderDiagram();
});
window.addEventListener('pointerup',()=>{
  if(!drag)return;

/* ---------- relação (clique na linha entre tabelas) ---------- */
let relCtx=null;
function relInfo(key){
  const [kind,tid,id]=key.split('|');
  const s=tOf(tid);if(!s)return null;
  if(kind==='col'){
    const c=cOf(s,id);if(!c||!c.ref)return null;
    const rt=tOf(c.ref.t),rc=rt&&cOf(rt,c.ref.c);
    const one=c.uq||(c.pk&&s.cols.filter(z=>z.pk).length===1);
    return {kind,s,obj:c,from:`${s.name}.${c.name}`,to:rt&&rc?`${rt.name}.${rc.name}`:'(destino removido)',del:c.del||'NO ACTION',card:one?'1:1':'N:1'};
  }
  const k=(s.constraints||[]).find(x=>x.id===id);if(!k||k.kind!=='fk')return null;
  const rt=tOf(k.ref.t);
  return {kind,s,obj:k,from:`${s.name} (${colNames(s,k.cols)})`,to:rt?`${rt.name} (${colNames(rt,k.ref.cols)})`:'(destino removido)',del:k.del||'NO ACTION',card:'N:1'};
}
function closeRel(){relCtx=null;const p=$('#relp');p.hidden=true;p.innerHTML=''}
function openRel(key,x,y){
  const i=relInfo(key);if(!i)return;

  p.innerHTML=`<div class="uh">Relação</div>
    <div class="rl1"><code>${esc(i.from)}</code></div>

    <div class="pr2"><span class="muted">Cardinalidade ${i.card}</span></div>
    <div class="pr2"><label>Ao apagar o pai&nbsp;<select data-rp="del">${optList(DEL,i.del)}</select></label></div>
    <div class="pr2"><span class="spacer"></span><button class="sm danger" data-rp="rm">Remover relação</button><button class="sm" data-rp="close">Fechar</button></div>`;
  p.hidden=false;
  p.style.left=Math.max(8,Math.min(x+12,innerWidth-320))+'px';
  p.style.top=Math.max(8,Math.min(y-10,innerHeight-200))+'px';
}
$('#relp').addEventListener('change',e=>{

/* ---------- copiar e colar tabela (Ctrl+C / Ctrl+V) ---------- */
let CLIP=null;
const cloneJ=x=>JSON.parse(JSON.stringify(x));
let pendingTableCopy=false;
const CLIP_TAG='MADB-TABELA:';
const campoEditavel=el=>!!el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable);
document.addEventListener('copy',e=>{
  if(!pendingTableCopy||!CLIP||campoEditavel(e.target))return;
  pendingTableCopy=false;
  e.clipboardData.setData('text/plain',CLIP_TAG+JSON.stringify(CLIP));
  e.preventDefault();
});
document.addEventListener('paste',e=>{
  if(campoEditavel(e.target))return;
  const txt=(e.clipboardData&&e.clipboardData.getData('text/plain'))||'';
  if(!txt.startsWith(CLIP_TAG))return;
  e.preventDefault();
  let obj=null;try{obj=JSON.parse(txt.slice(CLIP_TAG.length))}catch(_){}
  if(!obj||!obj.cols){setNotice('Não consegui colar: a área de transferência não tem uma tabela válida do MADB.');renderOut(true);return}
  colarDeClipboard(obj);
});
function copiarTabela(t){
  pendingTableCopy=true;setTimeout(()=>{pendingTableCopy=false},0);
  const ext={};
  const note=(tid,cid)=>{
    if(tid===t.id)return;
    const tt=tOf(tid);if(!tt)return;
    ext[tid]=ext[tid]||{schema:tt.schema||'public',name:tt.name,cols:{}};
    if(cid){const cc=cOf(tt,cid);if(cc)ext[tid].cols[cid]=cc.name}
  };
  t.cols.forEach(c=>{if(c.ref)note(c.ref.t,c.ref.c)});
  (t.constraints||[]).forEach(k=>{if(k.kind==='fk'){note(k.ref.t);k.ref.cols.forEach(cid=>note(k.ref.t,cid))}});
  const tipos=new Set(t.cols.map(c=>c.type));
  const enums=S.enums.filter(e=>tipos.has(e.name)||tipos.has((e.schema||'public')+'.'+e.name)).map(cloneJ);
  const usadas=new Set((t.triggers||[]).map(g=>g.function));
  const funcs=(S.functions||[]).filter(f=>usadas.has(f.schema+'.'+f.name)).map(cloneJ);
  CLIP=cloneJ(t);CLIP.ext=ext;CLIP.enums=enums;CLIP.funcs=funcs;CLIP.origem={wsId:DB.active,wsName:cur().name};
  setNotice('Tabela "'+t.name+'" copiada. Use Ctrl+V aqui ou em outra guia/arquitetura.');renderOut(true);
}
/* posição livre mais perto da tabela de origem: direita, abaixo, esquerda, acima e depois anéis maiores */
function acharVaga(src,h){
  const bateu=(x,y)=>S.tables.some(o=>o.x!=null&&o.y!=null&&x<o.x+W+30&&x+W+30>o.x&&y<o.y+tH(o)+30&&y+h+30>o.y);
  const gx=W+60,gy=h+50;
  for(let r=1;r<=30;r++){
    const ring=[];
    for(let i=-r;i<=r;i++)for(let j=-r;j<=r;j++)if(Math.max(Math.abs(i),Math.abs(j))===r)ring.push([i,j]);
    const prio=([i,j])=>(i===r&&j===0)?0:(j===r&&i===0)?1:(i===-r&&j===0)?2:(j===-r&&i===0)?3:4;
    ring.sort((a,b)=>prio(a)-prio(b)||Math.hypot(a[0],a[1])-Math.hypot(b[0],b[1]));
    for(const [i,j] of ring){const x=src.x+i*gx,y=src.y+j*gy;if(!bateu(x,y))return {x:x,y:y};}
  }
  return {x:src.x+gx,y:src.y};
}
/* colagem vinda da área de transferência: pede confirmação quando a tabela veio de outra arquitetura */
function colarDeClipboard(obj){
  CLIP=obj;
  if(obj.origem&&obj.origem.wsId===DB.active){colarTabela();return}
  const origem=obj.origem?obj.origem.wsName:'outra arquitetura';
  const ext=obj.ext||{};
  const ausentes=[...new Set(Object.values(ext).filter(ex=>!S.tables.some(x=>(x.schema||'public')===ex.schema&&x.name===ex.name)).map(ex=>ex.schema+'.'+ex.name))];
  const novosEnums=(obj.enums||[]).filter(e=>!S.enums.some(x=>x.name===e.name&&(x.schema||'public')===(e.schema||'public'))).map(e=>e.name);
  let msg='Você copiou "'+obj.name+'" da arquitetura "'+origem+'" e vai colar em "'+cur().name+'".';
  if(ausentes.length)msg+=' As FKs para '+ausentes.join(', ')+' serão removidas, porque essas tabelas não existem aqui.';
  if(novosEnums.length)msg+=' Serão criados os enums: '+novosEnums.join(', ')+'.';
  msg+=' Você tem certeza?';
  openModal({title:'Colar tabela de outra arquitetura?',input:false,ok:'Sim, colar',msg:msg,onOk:()=>colarTabela()});
}
function colarTabela(){
  const src=CLIP;if(!src)return;
  histBefore(null);
  const avisos=[];
  /* enums e funções usados pela tabela: criados aqui se ainda não existirem */
  (src.enums||[]).forEach(e=>{
    if(!S.enums.some(x=>x.name===e.name&&(x.schema||'public')===(e.schema||'public')))
      S.enums.push(Object.assign(cloneJ(e),{id:MADB.newId(S,'enum')}));
  });
  S.functions=S.functions||[];
  (src.funcs||[]).forEach(f=>{
    if(!S.functions.some(x=>x.name===f.name&&(x.schema||'public')===(f.schema||'public')))
      S.functions.push(Object.assign(cloneJ(f),{id:MADB.newId(S,'function')}));
  });
  const sc=src.schema||'public';
  const taken=new Set(S.tables.filter(x=>(x.schema||'public')===sc).map(x=>x.name));
  let nm=src.name+'_copia',k=2;while(taken.has(nm))nm=src.name+'_copia'+(k++);
  const t={id:MADB.newId(S,'table'),name:nm,schema:src.schema,x:null,y:null,cols:[]};
  if(src.comment)t.comment=src.comment;
  S.tables.push(t);
  /* tabela de destino de uma referência: procurada pelo nome nesta arquitetura */
  const resolve=(tid,cid)=>{
    const ex=src.ext[tid];if(!ex)return null;
    const tt=S.tables.find(x=>x!==t&&(x.schema||'public')===ex.schema&&x.name===ex.name);if(!tt)return null;
    const cc=tt.cols.find(c=>c.name===ex.cols[cid]);return cc?{t:tt.id,c:cc.id}:null;
  };
  const cmap={};
  src.cols.forEach(c=>{
    const id=MADB.newId(S,'col',t);cmap[c.id]=id;const o=Object.assign(cloneJ(c),{id});
    if(o.ref){
      if(o.ref.t===src.id)o.ref={t:t.id,c:cmap[o.ref.c]||o.ref.c};
      else{const r=resolve(o.ref.t,o.ref.c);if(r)o.ref=r;else{avisos.push('FK de '+c.name+' removida (destino não existe aqui)');o.ref=null;o.del='NO ACTION'}}
    }
    t.cols.push(o);
  });
  if(src.constraints){t.constraints=[];src.constraints.forEach(kc=>{
    const o=cloneJ(kc);
    if(o.kind==='fk'){
      if(o.ref.t===src.id){o.ref.t=t.id;o.ref.cols=o.ref.cols.map(id=>cmap[id]||id)}
      else{const rs=o.ref.cols.map(cid=>resolve(o.ref.t,cid));
        if(rs.some(r=>!r)){avisos.push('restrição '+(o.name||'FK')+' removida (destino não existe aqui)');return}
        o.ref={t:rs[0].t,cols:rs.map(r=>r.c)}}
    }
    o.id=MADB.newId(S,'constraint',t);
    if(o.cols)o.cols=o.cols.map(id=>cmap[id]||id);
    t.constraints.push(o);
  });if(!t.constraints.length)delete t.constraints}
  if(src.indexes){t.indexes=[];src.indexes.forEach(x=>{
    const o=cloneJ(x);o.id=MADB.newId(S,'index',t);
    o.cols=o.cols.map(e=>e.c?Object.assign(e,{c:cmap[e.c]||e.c}):e);
    t.indexes.push(o)})}
  if(src.triggers){t.triggers=[];src.triggers.forEach(g=>{const o=cloneJ(g);o.id=MADB.newId(S,'trigger',t);t.triggers.push(o)})}
  if(src.partition){t.partition=cloneJ(src.partition);t.partition.cols=t.partition.cols.map(id=>cmap[id]||id)}
  if(src.partitions){t.partitions=[];src.partitions.forEach(p=>{const o=cloneJ(p);o.id=MADB.newId(S,'partition',t);o.name=p.name+'_copia';t.partitions.push(o)})}
  /* tabela de outra arquitetura: o id pode existir aqui com outro significado, então não usa a posição dela */
  const deOutra=!src.origem||src.origem.wsId!==DB.active;
  const orig=deOutra?{x:0,y:0}:(tOf(src.id)||src);
  const vaga=acharVaga(orig.x!=null?orig:{x:0,y:0},tH(t));
  t.x=vaga.x;t.y=vaga.y;
  sel=t.id;closePop();renderAll();
  setNotice('Tabela colada: '+nm+(avisos.length?' · '+avisos.join('; '):' (posicione onde quiser)'));renderOut(true);
}

/* ---------- gerenciador de schemas e tabelas ---------- */
let mgrQ='';const mgrSel=new Set();
const schemaNames=()=>{
  const names=new Set((S.schemas||[]).map(s=>s.name));S.tables.forEach(t=>names.add(t.schema||'public'));
  names.add('public');
  return [...names].sort((a,b)=>a==='public'?-1:b==='public'?1:a.localeCompare(b));

const ofSchema=(tbl,n)=>(tbl.schema||'public')===n;
const casaBusca=t=>!mgrQ||t.name.toLowerCase().includes(mgrQ.toLowerCase());

function ensureSchema(n){if(n==='public')return;S.schemas=S.schemas||[];if(!S.schemas.some(x=>x.name===n))S.schemas.push({name:n})}
function afterMgr(msg){setNotice(msg);renderAll();renderMgr()}
function renderMgr(){

  let h='<div class="mh"><b>Schemas e tabelas</b><span class="spacer"></span><button class="sm ghost" data-m="close" aria-label="Fechar">×</button></div>';

    +'<span class="spacer"></span><button class="sm primary" data-m="newS">+ Schema</button></div>';
  h+='<div class="mlist">';
  names.forEach(n=>{
    const ts=S.tables.filter(t=>ofSchema(t,n)&&casaBusca(t));
    const todas=S.tables.filter(t=>ofSchema(t,n));
    const ne=S.enums.filter(e=>(e.schema||'public')===n).length+(S.functions||[]).filter(f=>(f.schema||'public')===n).length;
    const marcado=ts.length>0&&ts.every(t=>mgrSel.has(t.id));

      +'<button class="sm ghost" data-m="ren" data-s="'+esc(n)+'">Renomear</button>'
      +'<button class="sm ghost danger" data-m="del" data-s="'+esc(n)+'">Excluir</button></div>';
    h+=ts.map(t=>'<label class="mrow"><input type="checkbox" data-m="tab" data-id="'+t.id+'"'+(mgrSel.has(t.id)?' checked':'')+'><span class="mn">'+esc(t.name)+'</span><span class="muted">'+t.cols.length+' colunas</span></label>').join('')
      ||'<div class="muted pad">'+(mgrQ?'Nenhuma tabela com esse nome':'Sem tabelas')+'</div>';
    h+='</section>';
  });
  h+='</div>';
  h+='<div class="mfoot"><span>'+mgrSel.size+' selecionada(s)</span><span class="spacer"></span><span class="muted">Mover para</span>'
    +'<select id="mgTo">'+names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+'</select>'
    +'<button class="sm primary" data-m="move"'+(mgrSel.size?'':' disabled')+'>Mover</button></div>';
  $('#mgr .mg').innerHTML=h;
}
function abrirMgr(){mgrSel.clear();$('#mgr').hidden=false;renderMgr()}
function fecharMgr(){$('#mgr').hidden=true}
function mgrMover(){
  const to=$('#mgTo').value;const ids=[...mgrSel];if(!ids.length)return;
  histBefore(null);ensureSchema(to);
  let n=0;
  ids.forEach(id=>{const t=tOf(id);if(t&&!ofSchema(t,to)){t.schema=to;t.x=null;t.y=null;n++}});
  mgrSel.clear();
  afterMgr(n+' tabela(s) movida(s) para "'+to+'".');
}
function novoSchema(){
  openModal({title:'Novo schema',value:'novo_schema',ok:'Criar',msg:'Depois, marque as tabelas e use "Mover".',
    onOk:name=>{
      const n=String(name||'').trim().replace(/\s+/g,'_');if(!n)return;
      if(schemaNames().includes(n)){setNotice('Já existe um schema "'+n+'".');renderOut(true);return}
      histBefore(null);ensureSchema(n);afterMgr('Schema "'+n+'" criado.');
    }});
}
function renomearSchema(old){
  openModal({title:'Renomear schema',value:old,ok:'Renomear',
    onOk:name=>{
      const n=String(name||'').trim().replace(/\s+/g,'_');if(!n||n===old)return;
      if(schemaNames().includes(n)){setNotice('Já existe um schema "'+n+'".');renderOut(true);return}
      histBefore(null);
      S.tables.forEach(t=>{
        if(ofSchema(t,old))t.schema=n;
        t.cols.forEach(c=>{if(c.type&&c.type.startsWith(old+'.'))c.type=n+c.type.slice(old.length)});
        (t.triggers||[]).forEach(g=>{if(g.function&&g.function.startsWith(old+'.'))g.function=n+g.function.slice(old.length)});
      });
      S.enums.forEach(e=>{if((e.schema||'public')===old)e.schema=n});
      (S.functions||[]).forEach(f=>{if((f.schema||'public')===old)f.schema=n});
      if(S.schemas)S.schemas=S.schemas.map(s=>s.name===old?{name:n,comment:s.comment}:s);
      ensureSchema(n);
      afterMgr('Schema "'+old+'" renomeado para "'+n+'".');
    }});
}
function excluirSchema(n){
  if(n==='public'){setNotice('O schema public não pode ser excluído.');renderOut(true);return}
  const uso=S.tables.filter(t=>ofSchema(t,n)).length+S.enums.filter(e=>(e.schema||'public')===n).length+(S.functions||[]).filter(f=>(f.schema||'public')===n).length;
  if(uso){setNotice('Não dá para excluir "'+n+'": ainda tem '+uso+' item(ns). Mova as tabelas antes.');renderOut(true);renderMgr();return}
  confirmDel('o schema "'+n+'"',()=>{S.schemas=(S.schemas||[]).filter(s=>s.name!==n);afterMgr('Schema "'+n+'" excluído.')});
}

const GS={items:[],i:0};
function irTabela(id){sel=id;closePop();renderAll();const t=tOf(id);if(t){const cv=$('#canvas');panX=cv.clientWidth/2-(t.x+W/2)*zoom;panY=cv.clientHeight/2-(t.y+HH)*zoom;applyView()}}
function irColuna(tid,cid){irTabela(tid);const t=tOf(tid),c=t&&cOf(t,cid);if(c)openPop(t,c)}
function gsItems(q){
  const s=q.trim().toLowerCase();if(!s)return [];
  const hit=(...ps)=>ps.some(p=>String(p||'').toLowerCase().includes(s));
  const out=[];
  S.tables.forEach(t=>{
    const sc=t.schema||'public';
    if(hit(t.name,sc))out.push({k:'Tabela',l:(sc!=='public'?sc+'.':'')+t.name,d:t.cols.length+' colunas',run:()=>irTabela(t.id)});
    t.cols.forEach(c=>{if(hit(c.name))out.push({k:'Coluna',l:t.name+'.'+c.name,d:c.type,run:()=>irColuna(t.id,c.id)})});
  });
  schemaNames().forEach(n=>{if(hit(n))out.push({k:'Schema',l:n,d:S.tables.filter(t=>ofSchema(t,n)).length+' tabelas',run:()=>abrirMgr()})});
  S.enums.forEach(e=>{if(hit(e.name,e.schema))out.push({k:'Enum',l:(e.schema&&e.schema!=='public'?e.schema+'.':'')+e.name,d:e.values.length+' valores',run:()=>{sel=MODEL;renderAll()}})});
  return out.slice(0,60);
}

/* câmera: zoom e pan sem barra de rolagem. O ponto sob o cursor fica parado ao dar zoom */
const worldT=()=>`translate(${panX} ${panY}) scale(${zoom})`;
const worldG=o=>`<g id="world" transform="${worldT()}">${o}<g id="rcur"></g></g>`;
function applyView(){
  const w=$('#world');if(w)w.setAttribute('transform',worldT());
  const cv=$('#canvas');
  cv.style.backgroundSize=`${20*zoom}px ${20*zoom}px`;
  cv.style.backgroundPosition=`${panX}px ${panY}px`;
  $('#zl').textContent=Math.round(zoom*100)+'%';
  drawCursors();
}
function setZoom(z,cx,cy){
  const cv=$('#canvas');
  const nz=+Math.max(.2,Math.min(3,z)).toFixed(3);
  if(nz===zoom)return;
  const r=cv.getBoundingClientRect();
  const px=cx==null?cv.clientWidth/2:cx-r.left,py=cy==null?cv.clientHeight/2:cy-r.top;
  const wx=(px-panX)/zoom,wy=(py-panY)/zoom;
  zoom=nz;panX=px-wx*nz;panY=py-wy*nz;
  needFit=false;applyView();
}
$('#canvas').addEventListener('wheel',e=>{
  if(!S.tables.length)return;
  e.preventDefault();
  const dy=e.deltaMode===1?e.deltaY*16:e.deltaY;

},{passive:false});

/* ---------- colaboração (sala em tempo real) ---------- */
const SRV_KEY='madb_srv';
const PEER_COLORS=['#facc15','#60a5fa','#f472b6','#34d399','#fb923c','#a78bfa','#f87171','#22d3ee'];
const SALA={ws:null,room:null,srv:'',me:'',name:'',color:'',peers:{},lastT:{},lastOrder:'',lastMeta:'',applying:false,ready:false,pendingEdit:false,retry:null};
const SRV_PADRAO='wss://madb-sala.madb-sala.workers.dev';
const srvPadrao=()=>{try{return localStorage.getItem(SRV_KEY)||SRV_PADRAO}catch(e){return SRV_PADRAO}};
const salaAtiva=()=>!!(SALA.ws&&SALA.ws.readyState===1);
const editando=()=>{const a=document.activeElement;return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')&&!!a.closest('#editor,#pop,#relp')};
function randId(){const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('')}
function applyMeta(meta){
  S.options=meta.options||{};S.schemas=meta.schemas||[];S.enums=meta.enums||[];S.functions=meta.functions||[];
  SALA.lastMeta=JSON.stringify({options:S.options,schemas:S.schemas,enums:S.enums,functions:S.functions});
}
function salaConectar(room,srv){
  salaSair();
  SALA.room=room;SALA.srv=srv;SALA.me=Math.random().toString(36).slice(2,10);
  SALA.name=(loadUser().name||'').trim()||'Visitante';
  SALA.color=PEER_COLORS[parseInt(SALA.me,36)%PEER_COLORS.length];
  SALA.peers={};SALA.lastT={};SALA.lastOrder='';SALA.lastMeta='';SALA.ready=false;
  const ws=new WebSocket(srv.replace(/\/+$/,'')+'/room/'+room);
  SALA.ws=ws;
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}salaRecebe(m)};
  ws.onopen=()=>setSalaStatus();
  ws.onclose=()=>{
    if(SALA.ws!==ws)return;
    SALA.ws=null;SALA.ready=false;SALA.peers={};drawCursors();setSalaStatus();
    SALA.retry=setTimeout(()=>{const w=cur();if(w&&w.room&&w.room.id===room&&!SALA.ws)salaConectar(room,srv)},3000);
  };
  setSalaStatus();
}
function salaSair(){
  clearTimeout(SALA.retry);
  const ws=SALA.ws;SALA.ws=null;SALA.room=null;SALA.ready=false;SALA.peers={};
  if(ws){try{ws.close()}catch(_){}}
  drawCursors();setSalaStatus();
}
/* a sala acompanha a arquitetura ativa */
function salaSincronizar(){
  const w=cur(),want=w&&w.room?w.room.id:null;
  if(SALA.room===want)return;
  if(want)salaConectar(w.room.id,w.room.srv);else salaSair();
}
/* envia só o que mudou desde a última troca */
function salaEnviar(){
  if(!salaAtiva()||!SALA.ready||SALA.applying)return;
  const set={},now={};
  S.tables.forEach(t=>{const s=JSON.stringify(t);now[t.id]=s;if(SALA.lastT[t.id]!==s)set[t.id]=JSON.parse(s)});
  const del=Object.keys(SALA.lastT).filter(id=>!(id in now));
  const order=S.tables.map(t=>t.id),orderS=JSON.stringify(order);
  const meta={options:S.options||{},schemas:S.schemas||[],enums:S.enums||[],functions:S.functions||[]},metaS=JSON.stringify(meta);
  const msg={type:'patch'};let any=false;
  if(Object.keys(set).length||del.length){msg.set=set;msg.del=del;any=true}
  if(orderS!==SALA.lastOrder){msg.order=order;any=true}
  if(metaS!==SALA.lastMeta){msg.meta=meta;any=true}
  if(!any)return;
  SALA.lastT=now;SALA.lastOrder=orderS;SALA.lastMeta=metaS;
  SALA.ws.send(JSON.stringify(msg));
}
/* aplica o estado inteiro (state) ou uma mudança (patch) vinda de um colega */
function salaAplicar(m,ids){
  SALA.applying=true;
  try{
    if(m.type==='state'){
      const st=m.state;SALA.lastT={};
      ids.forEach(id=>{SALA.lastT[id]=JSON.stringify(st.tables[id])});
      S.tables=ids.map(id=>st.tables[id]);
      if(st.meta)applyMeta(st.meta);
      SALA.lastOrder=JSON.stringify(ids);
    }else{
      const map=new Map(S.tables.map(t=>[t.id,t]));
      Object.entries(m.set||{}).forEach(([id,t])=>{map.set(id,t);SALA.lastT[id]=JSON.stringify(t)});
      (m.del||[]).forEach(id=>{map.delete(id);delete SALA.lastT[id]});
      const order=Array.isArray(m.order)?m.order:[...map.keys()];
      S.tables=order.filter(id=>map.has(id)).map(id=>map.get(id)).concat([...map.keys()].filter(id=>!order.includes(id)).map(id=>map.get(id)));
      if(Array.isArray(m.order))SALA.lastOrder=JSON.stringify(m.order);
      if(m.meta)applyMeta(m.meta);
    }
    if(sel!==null&&sel!==MODEL&&!tOf(sel))sel=null;
    if(!editando())renderEditor();else SALA.pendingEdit=true;
    cur().model=S;
    renderOut();
  }finally{SALA.applying=false}
}
function salaRecebe(m){
  if(m.type==='state'){
    const st=m.state||{tables:{},order:[]};
    const ids=(st.order||[]).filter(id=>st.tables&&st.tables[id]).concat(Object.keys(st.tables||{}).filter(id=>!(st.order||[]).includes(id)));
    SALA.ready=true;
    if(!ids.length){
      // sala nova: sobe o modelo local
      if(S.tables.length){SALA.lastT={};SALA.lastOrder='';SALA.lastMeta='';salaEnviar()}
      return;
    }
    salaAplicar(m,ids);
    return;
  }
  if(!SALA.ready)return;
  if(m.type==='patch')salaAplicar(m);
  else if(m.type==='cur'){
    if(m.id===SALA.me)return;
    SALA.peers[m.id]={name:m.name,color:m.color,x:m.x,y:m.y};
    drawCursors();
  }
  else if(m.type==='leave'){delete SALA.peers[m.id];drawCursors();setSalaStatus()}
}
/* cursores dos colegas, em coordenadas do diagrama (tamanho constante na tela) */
function drawCursors(){
  const g=$('#rcur');if(!g)return;
  const k=1/zoom;
  g.innerHTML=Object.values(SALA.peers).map(p=>`<g transform="translate(${p.x} ${p.y}) scale(${k})"><path d="M0,0 L0,16 L4.5,12.3 L8,19 L10.8,17.7 L7.4,11 L13,11 Z" fill="${p.color}" stroke="#0a0a0a" stroke-width="1"/><text x="16" y="20" fill="${p.color}" class="rcn">${esc(p.name)}</text></g>`).join('');
}
let curT=0;
$('#canvas').addEventListener('pointermove',e=>{
  if(!salaAtiva()||!SALA.ready)return;
  const now=performance.now();if(now-curT<50)return;curT=now;
  const r=$('#canvas').getBoundingClientRect();
  SALA.ws.send(JSON.stringify({type:'cur',id:SALA.me,name:SALA.name,color:SALA.color,x:Math.round((e.clientX-r.left-panX)/zoom),y:Math.round((e.clientY-r.top-panY)/zoom)}));
});
$('#canvas').addEventListener('pointerleave',()=>{
  if(salaAtiva()&&SALA.ready)SALA.ws.send(JSON.stringify({type:'cur',id:SALA.me,hide:true}));
});

function salaCriar(){
  const srv=srvPadrao().trim();
  if(!/^wss?:\/\//.test(srv)){
    openModal({title:'Servidor de sala',input:false,ok:'OK',msg:'Informe o endereço do servidor de sala em "Seu perfil" (começa com wss://) antes de compartilhar.'});

function setSalaStatus(){
